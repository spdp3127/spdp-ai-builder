<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SPDP AI — Website Builder</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  background:#050505;
  color:#fff;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* HEADER */

.header{
  height:68px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  border-bottom:1px solid #202020;
  background:rgba(5,5,5,.96);
  position:sticky;
  top:0;
  z-index:100;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
}

.logo{
  width:38px;
  height:38px;
  border-radius:11px;
  display:grid;
  place-items:center;
  font-weight:900;
  font-size:15px;
  background:linear-gradient(145deg,#fff,#777);
  color:#050505;
  box-shadow:0 8px 25px rgba(255,255,255,.08);
}

.brand-text{
  font-size:17px;
  font-weight:800;
  letter-spacing:-.4px;
}

.brand-sub{
  color:#777;
  font-size:11px;
  margin-top:2px;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.btn{
  border:1px solid #2b2b2b;
  background:#111;
  color:#ddd;
  padding:9px 13px;
  border-radius:9px;
  transition:.2s;
}

.btn:hover{
  background:#191919;
  border-color:#444;
  color:#fff;
}

.btn.primary{
  background:#fff;
  color:#000;
  border-color:#fff;
  font-weight:800;
}

.btn.primary:hover{
  background:#ddd;
}

.btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}

/* MAIN */

.main{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:360px minmax(0,1fr);
}

/* LEFT */

.sidebar{
  min-width:0;
  border-right:1px solid #202020;
  background:#080808;
  display:flex;
  flex-direction:column;
}

.sidebar-section{
  padding:16px;
  border-bottom:1px solid #1c1c1c;
}

.label{
  color:#777;
  font-size:11px;
  font-weight:800;
  letter-spacing:.8px;
  text-transform:uppercase;
  margin-bottom:9px;
}

.prompt{
  width:100%;
  min-height:150px;
  resize:vertical;
  padding:13px;
  border-radius:12px;
  border:1px solid #292929;
  background:#0d0d0d;
  color:#eee;
  outline:none;
  line-height:1.55;
}

.prompt:focus{
  border-color:#555;
}

.generate-row{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.generate-row .btn{
  flex:1;
}

/* SUB CHAT */

.chat{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
}

.chat-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
}

.status{
  display:flex;
  align-items:center;
  gap:6px;
  color:#777;
  font-size:11px;
}

.status-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#555;
}

.status-dot.active{
  background:#fff;
}

.messages{
  flex:1;
  min-height:100px;
  overflow:auto;
  display:flex;
  flex-direction:column;
  gap:9px;
  margin-bottom:10px;
}

.message{
  border:1px solid #222;
  background:#0d0d0d;
  border-radius:10px;
  padding:10px;
  font-size:12px;
  line-height:1.5;
}

.message.user{
  background:#151515;
  border-color:#303030;
}

.message.ai{
  color:#aaa;
}

.chat-input{
  width:100%;
  min-height:75px;
  resize:none;
  padding:11px;
  border-radius:10px;
  border:1px solid #292929;
  background:#0d0d0d;
  color:#eee;
  outline:none;
}

.chat-input:focus{
  border-color:#555;
}

.chat-actions{
  display:flex;
  gap:7px;
  margin-top:8px;
}

.chat-actions .btn{
  flex:1;
}

/* WORKSPACE */

.workspace{
  min-width:0;
  display:flex;
  flex-direction:column;
  background:#030303;
}

/* TOOLBAR */

.toolbar{
  height:54px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 13px;
  border-bottom:1px solid #202020;
  background:#080808;
}

.toolbar-left,
.toolbar-right{
  display:flex;
  align-items:center;
  gap:6px;
}

.mode-btn{
  border:1px solid transparent;
  background:transparent;
  color:#777;
  padding:7px 10px;
  border-radius:7px;
  font-size:12px;
}

.mode-btn.active{
  background:#171717;
  border-color:#292929;
  color:#fff;
}

.device{
  border:1px solid #292929;
  background:#101010;
  color:#999;
  padding:7px 9px;
  border-radius:7px;
  font-size:11px;
}

.device.active{
  color:#fff;
  border-color:#444;
}

/* PREVIEW */

.preview-wrap{
  flex:1;
  min-height:0;
  position:relative;
  display:flex;
  justify-content:center;
  align-items:stretch;
  background:
    radial-gradient(circle at 50% 0%,#171717 0,#080808 35%,#030303 75%);
}

.preview-frame{
  width:100%;
  height:100%;
  border:0;
  background:#fff;
  transition:.25s;
}

.preview-frame.desktop{
  width:100%;
}

.preview-frame.tablet{
  width:768px;
  max-width:100%;
}

.preview-frame.mobile{
  width:390px;
  max-width:100%;
}

.code-panel{
  position:absolute;
  inset:0;
  display:none;
  background:#050505;
}

.code-panel.show{
  display:block;
}

.code-editor{
  width:100%;
  height:100%;
  resize:none;
  border:0;
  outline:none;
  background:#050505;
  color:#ddd;
  padding:20px;
  font:13px/1.55 Consolas,Monaco,monospace;
  tab-size:2;
}

/* EMPTY */

.empty{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  pointer-events:none;
}

.empty-box{
  max-width:500px;
  padding:30px;
}

.empty-logo{
  width:65px;
  height:65px;
  margin:0 auto 16px;
  border-radius:19px;
  display:grid;
  place-items:center;
  font-size:24px;
  font-weight:900;
  background:linear-gradient(145deg,#fff,#666);
  color:#000;
}

.empty h1{
  font-size:28px;
  letter-spacing:-1px;
  margin-bottom:8px;
}

.empty p{
  color:#666;
  font-size:13px;
  line-height:1.6;
}

/* LOADING */

.loading{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(5px);
  z-index:20;
}

.loading.show{
  display:flex;
}

.loading-box{
  padding:20px 25px;
  border:1px solid #292929;
  border-radius:14px;
  background:#0b0b0b;
  text-align:center;
}

.spinner{
  width:30px;
  height:30px;
  margin:0 auto 12px;
  border:3px solid #333;
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.loading-text{
  color:#aaa;
  font-size:12px;
}

/* TOAST */

.toast{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:999;
  padding:11px 14px;
  border:1px solid #333;
  background:#111;
  color:#eee;
  border-radius:9px;
  font-size:12px;
  opacity:0;
  transform:translateY(10px);
  pointer-events:none;
  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:translateY(0);
}

/* RESPONSIVE */

@media(max-width:900px){
  .main{
    grid-template-columns:300px minmax(0,1fr);
  }
}

@media(max-width:700px){
  .header{
    padding:0 12px;
  }

  .brand-sub{
    display:none;
  }

  .header-actions .btn:not(.primary){
    display:none;
  }

  .main{
    display:flex;
    flex-direction:column;
  }

  .sidebar{
    height:auto;
    max-height:48vh;
    border-right:0;
    border-bottom:1px solid #202020;
  }

  .chat{
    min-height:250px;
  }

  .workspace{
    min-height:65vh;
  }

  .toolbar{
    overflow:auto;
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="header">

    <div class="brand">
      <div class="logo">S</div>

      <div>
        <div class="brand-text">SPDP AI</div>
        <div class="brand-sub">Website · App · Game Builder</div>
      </div>
    </div>

    <div class="header-actions">
      <button class="btn" id="undoBtn">Undo</button>
      <button class="btn" id="redoBtn">Redo</button>
      <button class="btn" id="downloadBtn">Download</button>
      <button class="btn primary" id="openBtn">Open</button>
    </div>

  </header>


  <main class="main">

    <!-- SIDEBAR -->

    <aside class="sidebar">

      <section class="sidebar-section">

        <div class="label">Create Website</div>

        <textarea
          id="prompt"
          class="prompt"
          placeholder="Describe the website you want...

Example:
Create a premium black 3D gaming website with hero, games, features, pricing and footer."
        ></textarea>

        <div class="generate-row">
          <button class="btn primary" id="generateBtn">
            Generate
          </button>

          <button class="btn" id="clearBtn">
            Clear
          </button>
        </div>

      </section>


      <!-- SUB CHAT -->

      <section class="sidebar-section chat">

        <div class="chat-title">

          <div class="label" style="margin:0">
            Sub Chat
          </div>

          <div class="status">
            <span id="statusDot" class="status-dot"></span>
            <span id="statusText">Ready</span>
          </div>

        </div>

        <div id="messages" class="messages">

          <div class="message ai">
            Generate a website first. Then tell me what you want to change here.
          </div>

        </div>

        <textarea
          id="chatInput"
          class="chat-input"
          placeholder="Change the current website...

Example:
Make the navbar glassmorphism and change the hero button to blue."
        ></textarea>

        <div class="chat-actions">

          <button
            class="btn primary"
            id="editBtn"
          >
            Update Website
          </button>

          <button
            class="btn"
            id="clearChatBtn"
          >
            Clear Chat
          </button>

        </div>

      </section>

    </aside>


    <!-- WORKSPACE -->

    <section class="workspace">

      <div class="toolbar">

        <div class="toolbar-left">

          <button
            class="mode-btn active"
            id="previewMode"
          >
            Preview
          </button>

          <button
            class="mode-btn"
            id="codeMode"
          >
            Code
          </button>

          <button
            class="device active"
            data-device="desktop"
          >
            Desktop
          </button>

          <button
            class="device"
            data-device="tablet"
          >
            Tablet
          </button>

          <button
            class="device"
            data-device="mobile"
          >
            Mobile
          </button>

        </div>


        <div class="toolbar-right">

          <button
            class="btn"
            id="copyBtn"
          >
            Copy Code
          </button>

        </div>

      </div>


      <div class="preview-wrap">

        <div id="emptyState" class="empty">

          <div class="empty-box">

            <div class="empty-logo">
              S
            </div>

            <h1>Build with SPDP AI</h1>

            <p>
              Describe your website, application or game.
              Generate it and then use Sub Chat to modify
              the generated website.
            </p>

          </div>

        </div>


        <iframe
          id="preview"
          class="preview-frame desktop"
          sandbox="allow-scripts allow-forms allow-modals allow-popups allow-same-origin"
          style="display:none"
        ></iframe>


        <div
          id="codePanel"
          class="code-panel"
        >

          <textarea
            id="codeEditor"
            class="code-editor"
            spellcheck="false"
          ></textarea>

        </div>


        <div
          id="loading"
          class="loading"
        >

          <div class="loading-box">

            <div class="spinner"></div>

            <div
              id="loadingText"
              class="loading-text"
            >
              Generating website...
            </div>

          </div>

        </div>

      </div>

    </section>

  </main>

</div>


<div
  id="toast"
  class="toast"
></div>


<script>

const WORKER_URL =
  "https://spdp-ai.spdp3127.workers.dev/";


let currentHTML = "";

let history = [];

let historyIndex = -1;

let isBusy = false;


// ==========================================
// ELEMENTS
// ==========================================

const promptEl =
  document.getElementById("prompt");

const chatInput =
  document.getElementById("chatInput");

const preview =
  document.getElementById("preview");

const codeEditor =
  document.getElementById("codeEditor");

const codePanel =
  document.getElementById("codePanel");

const emptyState =
  document.getElementById("emptyState");

const loading =
  document.getElementById("loading");

const loadingText =
  document.getElementById("loadingText");

const messages =
  document.getElementById("messages");

const statusDot =
  document.getElementById("statusDot");

const statusText =
  document.getElementById("statusText");


// ==========================================
// TOAST
// ==========================================

let toastTimer;

function toast(message){

  const el =
    document.getElementById("toast");

  el.textContent = message;

  el.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(() => {
      el.classList.remove("show");
    }, 2500);
}


// ==========================================
// STATUS
// ==========================================

function setStatus(text, active=false){

  statusText.textContent = text;

  statusDot.classList.toggle(
    "active",
    active
  );
}


// ==========================================
// LOADING
// ==========================================

function setLoading(value, text){

  isBusy = value;

  loading.classList.toggle(
    "show",
    value
  );

  if(text){
    loadingText.textContent = text;
  }

  setStatus(
    value ? "Working..." : "Ready",
    value
  );

  document.getElementById(
    "generateBtn"
  ).disabled = value;

  document.getElementById(
    "editBtn"
  ).disabled = value;
}


// ==========================================
// HISTORY
// ==========================================

function saveHistory(html){

  if(!html) return;

  history =
    history.slice(
      0,
      historyIndex + 1
    );

  history.push(html);

  historyIndex =
    history.length - 1;

  updateHistoryButtons();
}


function updateHistoryButtons(){

  document.getElementById(
    "undoBtn"
  ).disabled =
    historyIndex <= 0;

  document.getElementById(
    "redoBtn"
  ).disabled =
    historyIndex >=
    history.length - 1;
}


// ==========================================
// SHOW HTML
// ==========================================

function showHTML(html){

  currentHTML = html;

  codeEditor.value =
    html;

  preview.srcdoc =
    html;

  preview.style.display =
    "block";

  emptyState.style.display =
    "none";

  codePanel.classList.remove(
    "show"
  );

  document.getElementById(
    "previewMode"
  ).classList.add("active");

  document.getElementById(
    "codeMode"
  ).classList.remove("active");
}


// ==========================================
// API
// ==========================================

async function callWorker(payload){

  const response =
    await fetch(
      WORKER_URL,
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify(payload)
      }
    );

  const raw =
    await response.text();

  let data;

  try{

    data =
      JSON.parse(raw);

  }catch(error){

    throw new Error(
      "Worker returned invalid JSON. " +
      raw.substring(0,300)
    );
  }

  if(!response.ok){

    throw new Error(
      data?.error ||
      "Worker request failed."
    );
  }

  if(!data?.success){

    throw new Error(
      data?.error ||
      "AI request failed."
    );
  }

  return data;
}


// ==========================================
// GENERATE
// ==========================================

async function generateWebsite(){

  if(isBusy) return;

  const prompt =
    promptEl.value.trim();

  if(!prompt){

    toast(
      "Enter a website prompt first."
    );

    promptEl.focus();

    return;
  }

  setLoading(
    true,
    "Generating your website..."
  );

  try{

    const data =
      await callWorker({
        action:"create",
        prompt:prompt
      });

    if(
      !data.html ||
      !data.html
        .toLowerCase()
        .includes("<!doctype html")
    ){

      throw new Error(
        "AI did not return valid HTML."
      );
    }

    saveHistory(
      data.html
    );

    showHTML(
      data.html
    );

    addMessage(
      "ai",
      "Website generated successfully. You can now edit it using Sub Chat."
    );

    toast(
      "Website generated successfully."
    );

  }catch(error){

    console.error(error);

    addMessage(
      "ai",
      "❌ " +
      error.message
    );

    toast(
      error.message
    );

  }finally{

    setLoading(
      false
    );
  }
}


// ==========================================
// EDIT EXISTING WEBSITE
// ==========================================

async function editWebsite(){

  if(isBusy) return;

  if(!currentHTML){

    toast(
      "Generate a website first."
    );

    return;
  }

  const instruction =
    chatInput.value.trim();

  if(!instruction){

    toast(
      "Tell Sub Chat what you want to change."
    );

    chatInput.focus();

    return;
  }

  addMessage(
    "user",
    instruction
  );

  chatInput.value =
    "";

  setLoading(
    true,
    "Updating your website..."
  );

  try{

    const data =
      await callWorker({

        action:"edit",

        prompt:instruction,

        currentHTML:
          currentHTML

      });

    if(
      !data.html ||
      !data.html
        .toLowerCase()
        .includes("<!doctype html")
    ){

      throw new Error(
        "AI did not return valid updated HTML."
      );
    }

    saveHistory(
      data.html
    );

    showHTML(
      data.html
    );

    addMessage(
      "ai",
      "Done. I updated the existing website while preserving the current HTML structure and functionality."
    );

    toast(
      "Website updated."
    );

  }catch(error){

    console.error(error);

    addMessage(
      "ai",
      "❌ " +
      error.message
    );

    toast(
      error.message
    );

  }finally{

    setLoading(
      false
    );
  }
}


// ==========================================
// CHAT MESSAGE
// ==========================================

function addMessage(
  type,
  text
){

  const div =
    document.createElement(
      "div"
    );

  div.className =
    "message " +
    type;

  div.textContent =
    text;

  messages.appendChild(
    div
  );

  messages.scrollTop =
    messages.scrollHeight;
}


// ==========================================
// PREVIEW / CODE
// ==========================================

document.getElementById(
  "previewMode"
).addEventListener(
  "click",
  () => {

    if(!currentHTML) return;

    codePanel.classList.remove(
      "show"
    );

    preview.style.display =
      "block";

    document.getElementById(
      "previewMode"
    ).classList.add("active");

    document.getElementById(
      "codeMode"
    ).classList.remove("active");

  }
);


document.getElementById(
  "codeMode"
).addEventListener(
  "click",
  () => {

    if(!currentHTML) return;

    codePanel.classList.add(
      "show"
    );

    preview.style.display =
      "none";

    document.getElementById(
      "codeMode"
    ).classList.add("active");

    document.getElementById(
      "previewMode"
    ).classList.remove("active");

  }
);


// ==========================================
// CODE EDITOR
// ==========================================

codeEditor.addEventListener(
  "input",
  () => {

    currentHTML =
      codeEditor.value;

  }
);


// ==========================================
// DEVICES
// ==========================================

document
  .querySelectorAll(".device")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        document
          .querySelectorAll(
            ".device"
          )
          .forEach(b =>
            b.classList.remove(
              "active"
            )
          );

        button.classList.add(
          "active"
        );

        const device =
          button.dataset.device;

        preview.classList.remove(
          "desktop",
          "tablet",
          "mobile"
        );

        preview.classList.add(
          device
        );

      }
    );

  });


// ==========================================
// COPY
// ==========================================

document.getElementById(
  "copyBtn"
).addEventListener(
  "click",
  async () => {

    if(!currentHTML){

      toast(
        "No generated code yet."
      );

      return;
    }

    try{

      await navigator.clipboard.writeText(
        currentHTML
      );

      toast(
        "Code copied."
      );

    }catch(error){

      codeEditor.select();

      document.execCommand(
        "copy"
      );

      toast(
        "Code copied."
      );
    }

  }
);


// ==========================================
// DOWNLOAD
// ==========================================

document.getElementById(
  "downloadBtn"
).addEventListener(
  "click",
  () => {

    if(!currentHTML){

      toast(
        "Generate a website first."
      );

      return;
    }

    const blob =
      new Blob(
        [currentHTML],
        {
          type:
            "text/html;charset=utf-8"
        }
      );

    const url =
      URL.createObjectURL(
        blob
      );

    const a =
      document.createElement(
        "a"
      );

    a.href =
      url;

    a.download =
      "spdp-ai-website.html";

    document.body.appendChild(
      a
    );

    a.click();

    a.remove();

    URL.revokeObjectURL(
      url
    );

    toast(
      "HTML downloaded."
    );

  }
);


// ==========================================
// OPEN
// ==========================================

document.getElementById(
  "openBtn"
).addEventListener(
  "click",
  () => {

    if(!currentHTML){

      toast(
        "Generate a website first."
      );

      return;
    }

    const blob =
      new Blob(
        [currentHTML],
        {
          type:
            "text/html"
        }
      );

    const url =
      URL.createObjectURL(
        blob
      );

    window.open(
      url,
      "_blank"
    );

    setTimeout(
      () =>
        URL.revokeObjectURL(
          url
        ),
      10000
    );

  }
);


// ==========================================
// UNDO
// ==========================================

document.getElementById(
  "undoBtn"
).addEventListener(
  "click",
  () => {

    if(
      historyIndex <= 0
    ){

      toast(
        "Nothing to undo."
      );

      return;
    }

    historyIndex--;

    showHTML(
      history[
        historyIndex
      ]
    );

    updateHistoryButtons();

    toast(
      "Undo complete."
    );

  }
);


// ==========================================
// REDO
// ==========================================

document.getElementById(
  "redoBtn"
).addEventListener(
  "click",
  () => {

    if(
      historyIndex >=
      history.length - 1
    ){

      toast(
        "Nothing to redo."
      );

      return;
    }

    historyIndex++;

    showHTML(
      history[
        historyIndex
      ]
    );

    updateHistoryButtons();

    toast(
      "Redo complete."
    );

  }
);


// ==========================================
// GENERATE BUTTON
// ==========================================

document.getElementById(
  "generateBtn"
).addEventListener(
  "click",
  generateWebsite
);


// ==========================================
// EDIT BUTTON
// ==========================================

document.getElementById(
  "editBtn"
).addEventListener(
  "click",
  editWebsite
);


// ==========================================
// ENTER SHORTCUTS
// ==========================================

promptEl.addEventListener(
  "keydown",
  event => {

    if(
      event.ctrlKey &&
      event.key === "Enter"
    ){

      event.preventDefault();

      generateWebsite();
    }

  }
);


chatInput.addEventListener(
  "keydown",
  event => {

    if(
      event.ctrlKey &&
      event.key === "Enter"
    ){

      event.preventDefault();

      editWebsite();
    }

  }
);


// ==========================================
// CLEAR
// ==========================================

document.getElementById(
  "clearBtn"
).addEventListener(
  "click",
  () => {

    promptEl.value =
      "";

  }
);


document.getElementById(
  "clearChatBtn"
).addEventListener(
  "click",
  () => {

    messages.innerHTML = "";

    addMessage(
      "ai",
      "Sub Chat cleared. Your current website is still preserved."
    );

  }
);


// ==========================================
// INITIAL STATE
// ==========================================

updateHistoryButtons();

setStatus(
  "Ready",
  false
);

</script>

</body>
</html>
