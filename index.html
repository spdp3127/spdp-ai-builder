<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050505">
<title>SPDP AI — Website Builder</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050505;color:#fff;font-family:Inter,Arial,sans-serif}
body{overflow:hidden}
button,textarea,input{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}

.app{height:100vh;display:flex}
.side{
width:240px;background:#0a0a0a;border-right:1px solid #202020;
padding:16px 12px;display:flex;flex-direction:column
}
.logo{display:flex;align-items:center;gap:10px;padding:8px 8px 22px;font-weight:800}
.mark{
width:38px;height:38px;border-radius:11px;
background:linear-gradient(135deg,#fff,#777);
color:#000;display:grid;place-items:center;font-weight:950
}
.nav button{
width:100%;padding:11px;border:0;background:transparent;color:#999;
text-align:left;border-radius:9px;margin:2px 0
}
.nav button:hover,.nav .active{background:#181818;color:#fff}
.bottom{
margin-top:auto;border-top:1px solid #222;padding:14px 8px;
color:#777;font-size:12px
}
.green{color:#35d07f}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{
height:62px;border-bottom:1px solid #222;display:flex;
align-items:center;justify-content:space-between;padding:0 18px
}
.ready{font-size:12px;color:#888}

.layout{
height:calc(100vh - 62px);display:grid;
grid-template-columns:350px 1fr;min-height:0
}
.left{
padding:14px;border-right:1px solid #222;
display:flex;flex-direction:column;min-height:0
}

.label{
font-size:10px;color:#777;text-transform:uppercase;
letter-spacing:1px;margin:5px 0 8px
}
.prompt,.edit{
background:#101010;border:1px solid #292929;color:#fff;
border-radius:12px;padding:13px;outline:none;resize:none
}
.prompt{height:125px}
.prompt:focus,.edit:focus,.code:focus{border-color:#7056e8}

.actions{display:flex;gap:7px;margin-top:8px}
.btn{
background:#111;border:1px solid #292929;color:#ddd;
border-radius:9px;padding:9px 11px
}
.primary{background:#7056e8;border-color:#7056e8;color:#fff}
.full{width:100%;margin-top:8px}

.files{
display:none;gap:6px;flex-wrap:wrap;
max-height:100px;overflow:auto;margin-top:8px
}
.files.show{display:flex}
.file{
background:#111;border:1px solid #292929;
padding:6px 8px;border-radius:7px;font-size:11px
}

.chat{
margin-top:12px;border:1px solid #222;border-radius:12px;
overflow:hidden;display:flex;flex-direction:column;
flex:1;min-height:0
}
.chathead{padding:10px;border-bottom:1px solid #222;font-size:12px}
.messages{flex:1;overflow:auto;padding:9px}
.msg{
padding:9px;border-radius:9px;margin-bottom:7px;
font-size:12px;white-space:pre-wrap
}
.msg.ai{background:#111;color:#aaa}
.msg.user{background:#211b3d}
.edit{
height:65px;border:0;border-top:1px solid #222;
border-radius:0
}
.chatfoot{padding:7px;border-top:1px solid #222}

.right{
min-width:0;min-height:0;display:flex;flex-direction:column
}
.toolbar{
height:52px;border-bottom:1px solid #222;
display:flex;justify-content:space-between;align-items:center;
padding:7px;gap:7px
}
.tools{display:flex;gap:5px;overflow:auto}
.tool{
white-space:nowrap;background:#111;border:1px solid #292929;
color:#aaa;border-radius:8px;padding:7px 9px;font-size:11px
}
.tool:hover,.tool.active{background:#1c1c1c;color:#fff}

.previewArea{
flex:1;min-height:0;background:#050505;padding:14px;
display:flex;justify-content:center;overflow:auto
}
.frame{
width:100%;height:100%;min-height:450px;
border:1px solid #292929;border-radius:9px;
background:#fff
}

.codePanel{
height:48%;display:none;flex-direction:column;
border-top:1px solid #222
}
.codePanel.show{display:flex}
.codeTitle{
height:40px;padding:0 10px;display:flex;
align-items:center;justify-content:space-between;
background:#0b0b0b;font-size:12px
}
.code{
flex:1;min-height:0;width:100%;
background:#050505;color:#ddd;border:0;outline:0;
resize:none;padding:13px;font:13px/1.5 Consolas,monospace
}
.codeBottom{
padding:7px;background:#0b0b0b;
border-top:1px solid #222;text-align:right
}

.menu{
position:fixed;display:none;background:#111;
border:1px solid #333;border-radius:11px;padding:5px;
z-index:50;box-shadow:0 15px 40px #000
}
.menu.show{display:block}
.menu button{
display:block;width:190px;text-align:left;padding:10px;
border:0;background:transparent;color:#ddd;border-radius:7px
}
.menu button:hover{background:#1d1d1d}

.toast{
position:fixed;bottom:18px;left:50%;
transform:translateX(-50%);
background:#171717;border:1px solid #333;
padding:9px 13px;border-radius:9px;
font-size:12px;display:none;z-index:999
}
.toast.show{display:block}

.loading{
position:absolute;inset:0;background:rgba(0,0,0,.65);
display:none;place-items:center;z-index:20;
backdrop-filter:blur(5px)
}
.loading.show{display:grid}
.loaderBox{
background:#111;border:1px solid #333;border-radius:14px;
padding:22px 28px;text-align:center;font-size:13px
}
.spinner{
width:28px;height:28px;border:3px solid #333;
border-top-color:#7c5cff;border-radius:50%;
animation:spin .8s linear infinite;margin:0 auto 12px
}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:850px){
.side{display:none}
.layout{grid-template-columns:1fr}
.left{display:none}
}
</style>

</head>

<body>

<div class="app">

<aside class="side">

<div class="logo">
<div class="mark">S</div>
<div>
SPDP AI
<div style="font-size:9px;color:#666">WEBSITE BUILDER</div>
</div>
</div>

<div class="nav">
<button class="active">✦ Builder</button>
<button id="codeNav">⌘ Code</button>
<button id="previewNav">◉ Preview</button>
<button id="assetsNav">▣ Assets</button>
</div>

<div class="bottom">
Cloudflare Workers AI<br>
<span class="green">● Connected</span>
</div>

</aside>

<main class="main">

<header class="top">
<b>AI Website Builder</b>
<span class="ready">
<span class="green">●</span> Connected
</span>
</header>

<div class="layout">

<section class="left">

<div class="label">Website prompt</div>

<textarea
id="prompt"
class="prompt"
placeholder="Create a premium black 3D gaming website with hero, games, pricing, about and contact sections..."
></textarea>

<div class="actions">
<button id="plus" class="btn">＋ Add</button>
<button id="clear" class="btn">Clear</button>
</div>

<button id="generate" class="btn primary full">
Generate Website
</button>

<div id="files" class="files"></div>

<input id="imgInput" type="file" accept="image/*" multiple hidden>
<input id="vidInput" type="file" accept="video/*" multiple hidden>
<input id="fileInput" type="file"
accept=".html,.css,.js,.json,.txt,.md,.pdf,.zip,.doc,.docx"
multiple hidden>

<div class="chat">

<div class="chathead">
<b>AI Sub-chat</b><br>
<span style="color:#666">Modify the current website</span>
</div>

<div id="messages" class="messages">
<div class="msg ai">
Generate a website, then tell me what you want to change.
</div>
</div>

<textarea
id="edit"
class="edit"
placeholder="Make the navbar glassmorphism and add 3D animations..."
></textarea>

<div class="chatfoot">
<button id="applyEdit" class="btn primary" style="width:100%">
Apply AI Edit
</button>
</div>

</div>

</section>

<section class="right">

<div class="toolbar">

<div class="tools">
<button id="previewBtn" class="tool active">Preview</button>
<button id="codeBtn" class="tool">Code</button>
<button id="previewEdit" class="tool">✎ Edit Preview</button>
<button id="three" class="tool">◇ 3D</button>
<button id="desk" class="tool active">Desktop</button>
<button id="tab" class="tool">Tablet</button>
<button id="mob" class="tool">Mobile</button>
</div>

<div class="tools">
<button id="undo" class="tool">↶</button>
<button id="redo" class="tool">↷</button>
<button id="copy" class="tool">Copy</button>
<button id="download" class="tool">Download</button>
</div>

</div>

<div class="previewArea">

<iframe
id="frame"
class="frame"
sandbox="allow-scripts allow-forms allow-modals allow-popups"
></iframe>

</div>

<div id="codePanel" class="codePanel">

<div class="codeTitle">
<b>HTML / CSS / JS</b>
<button id="copyCode" class="tool">Copy Code</button>
</div>

<textarea id="code" class="code" spellcheck="false"></textarea>

<div class="codeBottom">
<button id="reset" class="tool">Reset</button>
<button id="applyCode" class="tool primary">Apply Code</button>
</div>

</div>

</section>

</div>
</main>
</div>

<div id="menu" class="menu">
<button data-open="img">🖼️ Image</button>
<button data-open="vid">🎬 Video</button>
<button data-open="file">📄 File</button>
</div>

<div id="toast" class="toast"></div>

<div id="loading" class="loading">
<div class="loaderBox">
<div class="spinner"></div>
<div id="loadingText">AI is creating your website...</div>
</div>
</div>

<script>

const WORKER_URL =
"https://spdp-ai.spdp3127.workers.dev";

const $ = id => document.getElementById(id);

let html = localStorage.getItem("spdp_html") || "";
let undoStack = [];
let redoStack = [];
let picked = [];
let editing = false;

function toast(text){

$("toast").textContent = text;
$("toast").classList.add("show");

clearTimeout(window.toastTimer);

window.toastTimer = setTimeout(()=>{
$("toast").classList.remove("show");
},2500);

}

function loading(on,text){

$("loadingText").textContent =
text || "AI is working...";

$("loading").classList.toggle("show",on);

}

function clean(value){

let s = String(value || "").trim();

s = s.replace(/^```(?:html|HTML|javascript|js)?\s*/i,"");
s = s.replace(/\s*```\s*$/i,"");

const lower = s.toLowerCase();

let start = lower.indexOf("<!doctype html");

if(start < 0)
start = lower.indexOf("<html");

if(start >= 0)
s = s.substring(start);

const end =
s.toLowerCase().lastIndexOf("</html>");

if(end >= 0)
s = s.substring(0,end + 7);

return s.trim();

}

function valid(value){

const s = String(value || "").trim().toLowerCase();

return (
(s.startsWith("<!doctype html") || s.startsWith("<html")) &&
s.includes("<head") &&
s.includes("<body") &&
s.includes("</body>") &&
s.includes("</html>")
);

}

function showPreview(value){

$("frame").srcdoc = value;

}

function setHTML(value,saveHistory=true){

const cleaned = clean(value);

if(!valid(cleaned)){
toast("❌ Invalid HTML");
return false;
}

if(saveHistory && html){
undoStack.push(html);

if(undoStack.length > 30)
undoStack.shift();

}

redoStack = [];
html = cleaned;

$("code").value = html;
showPreview(html);

localStorage.setItem("spdp_html",html);

return true;

}

function message(type,text){

const d = document.createElement("div");

d.className = "msg " + type;
d.textContent = text;

$("messages").appendChild(d);

$("messages").scrollTop =
$("messages").scrollHeight;

}

async function api(action,prompt,currentHTML="",attachments=[]){

let endpoint = "/api/generate";

if(action === "edit")
endpoint = "/api/edit";

if(action === "chat")
endpoint = "/api/chat";

if(action === "test")
endpoint = "/api/test";

const response = await fetch(
WORKER_URL + endpoint,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
action,
prompt,
currentHTML,
attachments
})
}
);

const text = await response.text();

let data;

try{

data = JSON.parse(text);

}catch(error){

console.error("RAW WORKER RESPONSE:",text);

throw new Error(
"Worker returned invalid JSON: " +
text.substring(0,300)
);

}

if(!response.ok || data.success !== true){

throw new Error(
data.error ||
"AI request failed."
);

}

return data;

}


/* ADD MENU */

$("plus").onclick = e => {

const r = $("plus").getBoundingClientRect();

$("menu").style.left =
r.left + "px";

$("menu").style.top =
(r.top - 125) + "px";

$("menu").classList.toggle("show");

e.stopPropagation();

};

document.addEventListener("click",e=>{

if(
!e.target.closest("#menu") &&
!e.target.closest("#plus")
){

$("menu").classList.remove("show");

}

});

document.querySelectorAll("[data-open]")
.forEach(button=>{

button.onclick = ()=>{

const type = button.dataset.open;

$("menu").classList.remove("show");

if(type === "img")
$("imgInput").click();

if(type === "vid")
$("vidInput").click();

if(type === "file")
$("fileInput").click();

};

});

["imgInput","vidInput","fileInput"].forEach(id=>{

$(id).addEventListener("change",e=>{

picked.push(...Array.from(e.target.files || []));

renderFiles();

e.target.value = "";

});

});

function renderFiles(){

const box = $("files");

box.innerHTML = "";

box.classList.toggle(
"show",
picked.length > 0
);

picked.forEach((file,index)=>{

const d = document.createElement("div");

d.className = "file";

d.textContent =
"✓ " + file.name + " ×";

d.onclick = ()=>{

picked.splice(index,1);
renderFiles();

};

box.appendChild(d);

});

}


/* GENERATE */

$("generate").onclick = async ()=>{

const prompt =
$("prompt").value.trim();

if(!prompt)
return toast("Write a prompt first.");

$("generate").disabled = true;

$("generate").textContent =
"Generating...";

message("user",prompt);

loading(
true,
"AI is creating your website..."
);

try{

const attachments =
picked.map(file=>({
name:file.name,
type:file.type,
size:file.size
}));

const data =
await api(
"create",
prompt,
"",
attachments
);

const result =
clean(data.html);

if(!valid(result))
throw new Error(
"AI returned invalid HTML."
);

undoStack = [];
redoStack = [];

setHTML(result,false);

message(
"ai",
"✓ Website generated successfully."
);

toast("Website ready");

}catch(error){

console.error(error);

message(
"ai",
"❌ " + error.message
);

toast(error.message);

}finally{

loading(false);

$("generate").disabled = false;

$("generate").textContent =
"Generate Website";

}

};


/* AI EDIT */

$("applyEdit").onclick = async ()=>{

const prompt =
$("edit").value.trim();

if(!prompt)
return toast("Write an edit instruction.");

if(!html)
return toast("Generate a website first.");

$("applyEdit").disabled = true;

$("applyEdit").textContent =
"AI Working...";

message("user",prompt);

loading(
true,
"AI is modifying your website..."
);

try{

const data =
await api(
"edit",
prompt,
html
);

const result =
clean(data.html);

if(!valid(result))
throw new Error(
"AI returned invalid HTML while editing."
);

setHTML(result,true);

$("edit").value = "";

message(
"ai",
"✓ Website updated successfully."
);

toast("Change applied");

}catch(error){

console.error(error);

message(
"ai",
"❌ " + error.message
);

toast(error.message);

}finally{

loading(false);

$("applyEdit").disabled = false;

$("applyEdit").textContent =
"Apply AI Edit";

}

};


/* CODE PANEL */

$("codeBtn").onclick = ()=>{

$("codePanel").classList.toggle("show");

$("codeBtn").classList.toggle(
"active",
$("codePanel").classList.contains("show")
);

$("code").value = html;

};

$("previewBtn").onclick = ()=>{

$("codePanel").classList.remove("show");

$("previewBtn").classList.add("active");

$("codeBtn").classList.remove("active");

if(html)
showPreview(html);

};

$("applyCode").onclick = ()=>{

if(setHTML($("code").value,true))
toast("✓ Code applied");

};

$("reset").onclick = ()=>{
$("code").value = html;
};

$("copy").onclick = async ()=>{

if(!html)
return toast("No website yet.");

try{

await navigator.clipboard.writeText(html);

toast("✓ HTML copied");

}catch{

toast("Copy failed");

}

};

$("copyCode").onclick = async ()=>{

try{

await navigator.clipboard.writeText(
$("code").value
);

toast("✓ Code copied");

}catch{

toast("Copy failed");

}

};


/* DOWNLOAD */

$("download").onclick = ()=>{

if(!html)
return toast("No website yet.");

const blob =
new Blob(
[html],
{type:"text/html;charset=utf-8"}
);

const url =
URL.createObjectURL(blob);

const a =
document.createElement("a");

a.href = url;
a.download = "spdp-ai-website.html";

document.body.appendChild(a);

a.click();
a.remove();

setTimeout(
()=>URL.revokeObjectURL(url),
1000
);

};


/* DEVICE PREVIEW */

function setDevice(width){

$("frame").style.width = width;

document.querySelectorAll(
"#desk,#tab,#mob"
).forEach(x=>x.classList.remove("active"));

if(width === "100%")
$("desk").classList.add("active");

if(width === "768px")
$("tab").classList.add("active");

if(width === "390px")
$("mob").classList.add("active");

}

$("desk").onclick = ()=>{
setDevice("100%");
};

$("tab").onclick = ()=>{
setDevice("768px");
};

$("mob").onclick = ()=>{
setDevice("390px");
};


/* UNDO */

$("undo").onclick = ()=>{

if(!undoStack.length)
return toast("Nothing to undo.");

redoStack.push(html);

const previous =
undoStack.pop();

html = previous;

$("code").value = html;

showPreview(html);

localStorage.setItem(
"spdp_html",
html
);

toast("Undo");

};


/* REDO */

$("redo").onclick = ()=>{

if(!redoStack.length)
return toast("Nothing to redo.");

undoStack.push(html);

const next =
redoStack.pop();

html = next;

$("code").value = html;

showPreview(html);

localStorage.setItem(
"spdp_html",
html
);

toast("Redo");

};


/* PREVIEW EDIT */

$("previewEdit").onclick = ()=>{

if(!html)
return toast("Generate a website first.");

editing = !editing;

$("previewEdit").classList.toggle(
"active",
editing
);

const injected = `

<style>
body.spdp-editing *{
cursor:pointer!important;
}
body.spdp-editing *:hover{
outline:2px dashed #7c5cff!important;
outline-offset:2px;
}
</style>

<script>
(function(){

let enabled=false;

window.addEventListener("message",function(event){

if(event.data && event.data.type==="SPDP_EDIT"){

enabled=!!event.data.enabled;

document.body.classList.toggle(
"spdp-editing",
enabled
);

}

});

document.addEventListener("click",function(event){

if(!enabled)return;

const target=event.target;

if(
!target ||
target===document.body ||
target.tagName==="HTML"
)return;

event.preventDefault();
event.stopPropagation();

target.contentEditable="true";
target.focus();

target.onblur=function(){

target.contentEditable="false";

window.parent.postMessage(
{
type:"SPDP_SAVE",
html:"<!DOCTYPE html>"+
document.documentElement.outerHTML
},
"*"
);

};

});

})();
<\/script>
`;

$("frame").srcdoc =
html.replace(
"</body>",
injected + "</body>"
);

setTimeout(()=>{

try{

$("frame").contentWindow.postMessage(
{
type:"SPDP_EDIT",
enabled:editing
},
"*"
);

}catch{}

},150);

toast(
editing
? "Preview editing ON"
: "Preview editing OFF"
);

};

window.addEventListener("message",event=>{

if(
event.data &&
event.data.type==="SPDP_SAVE"
){

const result =
clean(event.data.html);

if(valid(result)){

setHTML(result,true);

toast("✓ Preview changes saved");

}

}

});


/* 3D PREVIEW */

$("three").onclick = ()=>{

if(!html)
return toast("Generate a website first.");

const add = `

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"><\/script>

<style>
#spdp3d{
position:fixed;
right:18px;
bottom:18px;
width:180px;
height:180px;
background:#050505;
border:1px solid #333;
border-radius:18px;
z-index:99999;
overflow:hidden;
box-shadow:0 15px 50px rgba(0,0,0,.5);
}
<\/style>

<div id="spdp3d"></div>

<script>
(function(){

function start(){

if(!window.THREE)return;

const box =
document.getElementById("spdp3d");

if(!box)return;

const scene =
new THREE.Scene();

const camera =
new THREE.PerspectiveCamera(
45,1,.1,100
);

camera.position.z=3;

const renderer =
new THREE.WebGLRenderer({
antialias:true,
alpha:true
});

renderer.setSize(180,180);

box.appendChild(
renderer.domElement
);

const object =
new THREE.Mesh(
new THREE.IcosahedronGeometry(.75,2),
new THREE.MeshStandardMaterial({
color:0x7c5cff,
metalness:.85,
roughness:.18
})
);

scene.add(object);

const light =
new THREE.PointLight(
0xffffff,
5
);

light.position.set(2,2,3);

scene.add(light);

scene.add(
new THREE.AmbientLight(
0xffffff,.7
)
);

function animate(){

requestAnimationFrame(animate);

object.rotation.x += .01;
object.rotation.y += .015;

renderer.render(
scene,
camera
);

}

animate();

}

if(window.THREE)
start();
else
window.addEventListener(
"load",
start
);

})();
<\/script>
`;

$("frame").srcdoc =
html.replace(
"</body>",
add + "</body>"
);

toast("3D preview enabled");

};


/* CLEAR */

$("clear").onclick = ()=>{

if(!confirm("Clear this project?"))
return;

html = "";
undoStack = [];
redoStack = [];
picked = [];

$("code").value = "";
$("frame").srcdoc = "";

localStorage.removeItem(
"spdp_html"
);

$("messages").innerHTML = `
<div class="msg ai">
Generate a website, then tell me what you want to change.
</div>
`;

renderFiles();

toast("Project cleared");

};


/* NAV */

$("codeNav").onclick = ()=>{

};
