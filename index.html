<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050505">
<title>SPDP AI — Website Builder</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050505;color:#fff;font-family:Inter,Arial,sans-serif}
button,textarea,input{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}

.app{height:100vh;display:flex}
.side{width:240px;background:#0a0a0a;border-right:1px solid #202020;padding:16px 12px;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:10px;padding:8px 8px 22px;font-weight:800}
.mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#fff,#777);color:#000;display:grid;place-items:center;font-weight:950}
.nav button{width:100%;padding:11px;border:0;background:transparent;color:#999;text-align:left;border-radius:9px;margin:2px 0}
.nav button:hover,.nav .active{background:#181818;color:#fff}
.bottom{margin-top:auto;border-top:1px solid #222;padding:14px 8px;color:#777;font-size:12px}
.green{color:#35d07f}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:62px;border-bottom:1px solid #222;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.ready{font-size:12px;color:#888}

.layout{height:calc(100vh - 62px);display:grid;grid-template-columns:350px 1fr;min-height:0}
.left{padding:14px;border-right:1px solid #222;display:flex;flex-direction:column;min-height:0}

.label{font-size:10px;color:#777;text-transform:uppercase;letter-spacing:1px;margin:5px 0 8px}
.prompt,.edit{background:#101010;border:1px solid #292929;color:#fff;border-radius:12px;padding:13px;outline:none;resize:none}
.prompt{height:125px}
.prompt:focus,.edit:focus,.code:focus{border-color:#7056e8}

.actions{display:flex;gap:7px;margin-top:8px}
.btn{background:#111;border:1px solid #292929;color:#ddd;border-radius:9px;padding:9px 11px}
.primary{background:#7056e8;border-color:#7056e8;color:#fff}
.full{width:100%;margin-top:8px}

.files{display:none;gap:6px;flex-wrap:wrap;max-height:100px;overflow:auto;margin-top:8px}
.files.show{display:flex}
.file{background:#111;border:1px solid #292929;padding:6px 8px;border-radius:7px;font-size:11px}

.chat{margin-top:12px;border:1px solid #222;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;flex:1;min-height:0}
.chathead{padding:10px;border-bottom:1px solid #222;font-size:12px}
.messages{flex:1;overflow:auto;padding:9px}
.msg{padding:9px;border-radius:9px;margin-bottom:7px;font-size:12px;white-space:pre-wrap}
.msg.ai{background:#111;color:#aaa}
.msg.user{background:#211b3d}
.edit{height:65px;border:0;border-top:1px solid #222;border-radius:0}
.chatfoot{padding:7px;border-top:1px solid #222}

.right{min-width:0;min-height:0;display:flex;flex-direction:column}
.toolbar{height:52px;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center;padding:7px;gap:7px}
.tools{display:flex;gap:5px;overflow:auto}
.tool{white-space:nowrap;background:#111;border:1px solid #292929;color:#aaa;border-radius:8px;padding:7px 9px;font-size:11px}
.tool:hover,.tool.active{background:#1c1c1c;color:#fff}

.previewArea{flex:1;min-height:0;background:#050505;padding:14px;display:flex;justify-content:center;overflow:auto}
.frame{width:100%;height:100%;min-height:450px;border:1px solid #292929;border-radius:9px;background:#fff}

.codePanel{height:48%;display:none;flex-direction:column;border-top:1px solid #222}
.codePanel.show{display:flex}
.codeTitle{height:40px;padding:0 10px;display:flex;align-items:center;justify-content:space-between;background:#0b0b0b;font-size:12px}
.code{flex:1;min-height:0;width:100%;background:#050505;color:#ddd;border:0;outline:0;resize:none;padding:13px;font:13px/1.5 Consolas,monospace}
.codeBottom{padding:7px;background:#0b0b0b;border-top:1px solid #222;text-align:right}

.menu{position:fixed;display:none;background:#111;border:1px solid #333;border-radius:11px;padding:5px;z-index:50;box-shadow:0 15px 40px #000}
.menu.show{display:block}
.menu button{display:block;width:190px;text-align:left;padding:10px;border:0;background:transparent;color:#ddd;border-radius:7px}
.menu button:hover{background:#1d1d1d}

.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#171717;border:1px solid #333;padding:9px 13px;border-radius:9px;font-size:12px;display:none;z-index:99}
.toast.show{display:block}

@media(max-width:850px){
.side{display:none}
.layout{grid-template-columns:1fr}
.left{display:none}
}
</style>
</head>

<body>

<div class="app">

<aside class="side">
  <div class="logo">
    <div class="mark">S</div>
    <div>
      SPDP AI
      <div style="font-size:9px;color:#666">WEBSITE BUILDER</div>
    </div>
  </div>

  <div class="nav">
    <button class="active">✦ Builder</button>
    <button id="codeNav">⌘ Code</button>
    <button id="previewNav">◉ Preview</button>
    <button id="assetsNav">▣ Assets</button>
  </div>

  <div class="bottom">
    Cloudflare Workers AI<br>
    <span class="green">● Ready</span>
  </div>
</aside>

<main class="main">

<header class="top">
  <b>AI Website Builder</b>
  <span class="ready"><span class="green">●</span> Ready</span>
</header>

<div class="layout">

<section class="left">

<div class="label">Website prompt</div>

<textarea
 id="prompt"
 class="prompt"
 placeholder="Create a premium black 3D gaming website with hero, games, pricing, about and contact sections..."
></textarea>

<div class="actions">
  <button id="plus" class="btn">＋ Add</button>
  <button id="clear" class="btn">Clear</button>
</div>

<button id="generate" class="btn primary full">
  Generate Website
</button>

<div id="files" class="files"></div>

<input id="imgInput" type="file" accept="image/*" multiple hidden>
<input id="vidInput" type="file" accept="video/*" multiple hidden>
<input id="fileInput" type="file"
 accept=".html,.css,.js,.json,.txt,.md,.pdf,.zip,.doc,.docx"
 multiple hidden>

<div class="chat">

<div class="chathead">
  <b>AI Sub-chat</b><br>
  <span style="color:#666">Modify the current website</span>
</div>

<div id="messages" class="messages">
  <div class="msg ai">
    Generate a website, then tell me what you want to change.
  </div>
</div>

<textarea
 id="edit"
 class="edit"
 placeholder="Make the navbar glassmorphism and add 3D animations..."
></textarea>

<div class="chatfoot">
  <button id="applyEdit" class="btn primary" style="width:100%">
    Apply AI Edit
  </button>
</div>

</div>
</section>

<section class="right">

<div class="toolbar">

<div class="tools">
<button id="previewBtn" class="tool active">Preview</button>
<button id="codeBtn" class="tool">Code</button>
<button id="previewEdit" class="tool">✎ Edit Preview</button>
<button id="three" class="tool">◇ 3D</button>
<button id="desk" class="tool">Desktop</button>
<button id="tab" class="tool">Tablet</button>
<button id="mob" class="tool">Mobile</button>
</div>

<div class="tools">
<button id="undo" class="tool">↶</button>
<button id="redo" class="tool">↷</button>
<button id="copy" class="tool">Copy</button>
<button id="download" class="tool">Download</button>
</div>

</div>

<div class="previewArea">
<iframe
 id="frame"
 class="frame"
 sandbox="allow-scripts allow-forms allow-modals allow-popups allow-same-origin"
></iframe>
</div>

<div id="codePanel" class="codePanel">

<div class="codeTitle">
  <b>HTML / CSS / JS</b>
  <button id="copyCode" class="tool">Copy Code</button>
</div>

<textarea id="code" class="code" spellcheck="false"></textarea>

<div class="codeBottom">
  <button id="reset" class="tool">Reset</button>
  <button id="applyCode" class="tool primary">Apply Code</button>
</div>

</div>

</section>
</div>
</main>
</div>

<div id="menu" class="menu">
<button data-open="img">🖼️ Image</button>
<button data-open="vid">🎬 Video</button>
<button data-open="file">📄 File</button>
</div>

<div id="toast" class="toast"></div>

<script>

const WORKER_URL =
"https://spdp-ai.spdp3127.workers.dev/";

const $ = id => document.getElementById(id);

let html =
localStorage.getItem("spdp_html") || "";

let undo = [];
let redo = [];
let picked = [];
let editing = false;

function toast(text){
  $("toast").textContent=text;
  $("toast").classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer=setTimeout(()=>{
    $("toast").classList.remove("show");
  },2300);
}

function clean(s){

  s=String(s||"").trim();

  s=s.replace(/^```html\s*/i,"");
  s=s.replace(/^```\s*/i,"");
  s=s.replace(/\s*```$/i,"");

  const lower=s.toLowerCase();

  let start=lower.indexOf("<!doctype html");

  if(start<0)
    start=lower.indexOf("<html");

  if(start>0)
    s=s.slice(start);

  const end=s.toLowerCase().lastIndexOf("</html>");

  if(end>=0)
    s=s.slice(0,end+7);

  return s.trim();
}

function valid(s){

  const x=String(s||"").toLowerCase();

  return (
    (x.trim().startsWith("<!doctype html") ||
     x.trim().startsWith("<html")) &&
    x.includes("<head") &&
    x.includes("<body") &&
    x.includes("</body>") &&
    x.includes("</html>")
  );
}

function preview(s){
  $("frame").srcdoc=s;
}

function setHTML(s,history=true){

  s=clean(s);

  if(!valid(s)){
    toast("❌ Invalid HTML");
    return false;
  }

  if(history && html)
    undo.push(html);

  redo=[];

  html=s;

  $("code").value=s;

  preview(s);

  localStorage.setItem(
    "spdp_html",
    s
  );

  return true;
}

function msg(type,text){

  const d=document.createElement("div");

  d.className="msg "+type;

  d.textContent=text;

  $("messages").appendChild(d);

  $("messages").scrollTop =
    $("messages").scrollHeight;
}

async function api(payload){

  const r=await fetch(
    WORKER_URL,
    {
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify(payload)
    }
  );

  const text=await r.text();

  let data;

  try{
    data=JSON.parse(text);
  }catch{
    throw new Error(
      "Worker returned invalid JSON."
    );
  }

  if(!r.ok || !data.success){
    throw new Error(
      data.error || "AI request failed."
    );
  }

  return data;
}

$("plus").onclick=e=>{

  const r=$("plus").getBoundingClientRect();

  $("menu").style.left=r.left+"px";
  $("menu").style.top=(r.top-125)+"px";

  $("menu").classList.toggle("show");

  e.stopPropagation();
};

document.onclick=e=>{
  if(
    !e.target.closest("#menu") &&
    !e.target.closest("#plus")
  ){
    $("menu").classList.remove("show");
  }
};

document
.querySelectorAll("[data-open]")
.forEach(b=>{

  b.onclick=()=>{

    const x=b.dataset.open;

    $("menu").classList.remove("show");

    if(x==="img")
      $("imgInput").click();

    if(x==="vid")
      $("vidInput").click();

    if(x==="file")
      $("fileInput").click();
  };
});

["imgInput","vidInput","fileInput"]
.forEach(id=>{

  $(id).onchange=e=>{

    picked.push(
      ...Array.from(e.target.files||[])
    );

    renderFiles();

    e.target.value="";
  };
});

function renderFiles(){

  const box=$("files");

  box.innerHTML="";

  box.classList.toggle(
    "show",
    picked.length>0
  );

  picked.forEach((f,i)=>{

    const d=document.createElement("div");

    d.className="file";

    d.textContent="✓ "+f.name+" ×";

    d.onclick=()=>{

      picked.splice(i,1);

      renderFiles();
    };

    box.appendChild(d);
  });
}


/* GENERATE */

$("generate").onclick=async()=>{

  const p=$("prompt").value.trim();

  if(!p)
    return toast("Write a prompt first.");

  $("generate").disabled=true;
  $("generate").textContent="Generating...";

  msg("user",p);

  try{

    const attachments=picked.map(f=>({
      name:f.name,
      type:f.type,
      size:f.size
    }));

    const d=await api({
      action:"create",
      prompt:p,
      currentHTML:"",
      attachments
    });

    const h=clean(d.html);

    if(!valid(h))
      throw new Error(
        "AI returned invalid HTML."
      );

    undo=[];
    redo=[];

    setHTML(h,false);

    msg(
      "ai",
      "✓ Website generated."
    );

    toast("Website ready");

  }catch(e){

    msg(
      "ai",
      "❌ "+e.message
    );

    toast(e.message);

  }finally{

    $("generate").disabled=false;
    $("generate").textContent=
      "Generate Website";
  }
};


/* AI EDIT */

$("applyEdit").onclick=async()=>{

  const p=$("edit").value.trim();

  if(!p)
    return;

  if(!html)
    return toast(
      "Generate a website first."
    );

  $("applyEdit").disabled=true;
  $("applyEdit").textContent=
    "AI Working...";

  msg("user",p);

  try{

    const d=await api({
      action:"edit",
      prompt:p,
      currentHTML:html
    });

    const h=clean(d.html);

    if(!valid(h))
      throw new Error(
        "AI returned invalid HTML."
      );

    setHTML(h,true);

    $("edit").value="";

    msg(
      "ai",
      "✓ Change applied."
    );

    toast("Updated");

  }catch(e){

    msg(
      "ai",
      "❌ "+e.message
    );

    toast(e.message);

  }finally{

    $("applyEdit").disabled=false;
    $("applyEdit").textContent=
      "Apply AI Edit";
  }
};


/* CODE */

$("codeBtn").onclick=()=>{

  $("codePanel").classList.toggle("show");

  $("codeBtn").classList.toggle(
    "active",
    $("codePanel").classList.contains("show")
  );

  $("code").value=html;
};

$("previewBtn").onclick=()=>{

  $("codePanel").classList.remove("show");

  $("previewBtn").classList.add("active");

  $("codeBtn").classList.remove("active");
};

$("applyCode").onclick=()=>{

  if(
    setHTML(
      $("code").value,
      true
    )
  ){
    toast("✓ Code applied");
  }
};

$("reset").onclick=()=>{
  $("code").value=html;
};

$("copy").onclick=()=>{

  navigator.clipboard
  .writeText(html)
  .then(()=>toast("Copied"));
};

$("copyCode").onclick=()=>{

  navigator.clipboard
  .writeText($("code").value)
  .then(()=>toast("Copied"));
};

$("download").onclick=()=>{

  if(!html)
    return toast(
      "No website yet"
    );

  const a=document.createElement("a");

  a.href=URL.createObjectURL(
    new Blob(
      [html],
      {type:"text/html"}
    )
  );

  a.download="spdp-website.html";

  a.click();
};


/* DEVICES */

function width(x){
  $("frame").style.width=x;
}

$("desk").onclick=()=>{
  width("100%");
};

$("tab").onclick=()=>{
  width("768px");
};

$("mob").onclick=()=>{
  width("390px");
};


/* UNDO */

$("undo").onclick=()=>{

  if(!undo.length)
    return toast(
      "Nothing to undo"
    );

  redo.push(html);

  const x=undo.pop();

  html=x;

  $("code").value=x;

  preview(x);

  localStorage.setItem(
    "spdp_html",
    x
  );
};


/* REDO */

$("redo").onclick=()=>{

  if(!redo.length)
    return toast(
      "Nothing to redo"
    );

  undo.push(html);

  const x=redo.pop();

  html=x;

  $("code").value=x;

  preview(x);

  localStorage.setItem(
    "spdp_html",
    x
  );
};


/* PREVIEW EDIT */

$("previewEdit").onclick=()=>{

  if(!html)
    return toast(
      "Generate a website first"
    );

  editing=!editing;

  $("previewEdit")
    .classList.toggle(
      "active",
      editing
    );

  const injected=`

<style>
body.spdp-editing *{
  cursor:pointer!important;
}
body.spdp-editing *:hover{
  outline:2px dashed #7c5cff!important;
  outline-offset:2px;
}
</style>

<script>
(()=>{

let on=false;

window.addEventListener(
"message",
e=>{
  if(e.data?.type==="EDIT"){
    on=e.data.on;
    document.body.classList.toggle(
      "spdp-editing",
      on
    );
  }
});

document.addEventListener(
"click",
e=>{

  if(!on)return;

  const x=e.target;

  if(!x || x===document.body)
    return;

  e.preventDefault();

  x.contentEditable="true";
  x.focus();

  x.onblur=()=>{

    x.contentEditable="false";

    parent.postMessage({
      type:"SAVE",
      html:"<!DOCTYPE html>"+
      document.documentElement.outerHTML
    },"*");
  };
});

})();
<\/script>`;

  $("frame").srcdoc=
    html.replace(
      "</body>",
      injected+"</body>"
    );

  setTimeout(()=>{
    $("frame")
    .contentWindow
    .postMessage(
      {
        type:"EDIT",
        on:editing
      },
      "*"
    );
  },100);

  toast(
    editing
      ? "Preview edit ON"
      : "Preview edit OFF"
  );
};

window.addEventListener(
"message",
e=>{

  if(e.data?.type==="SAVE"){

    const h=clean(e.data.html);

    if(valid(h))
      setHTML(h,true);
  }
});


/* 3D */

$("three").onclick=()=>{

  if(!html)
    return toast(
      "Generate a website first"
    );

  const add=`

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"><\/script>

<style>
#spdp3d{
position:fixed;
right:18px;
bottom:18px;
width:170px;
height:170px;
background:#050505;
border:1px solid #333;
border-radius:18px;
z-index:99999;
overflow:hidden;
}
</style>

<div id="spdp3d"></div>

<script>
(function(){

if(!window.THREE)return;

const c=document.getElementById("spdp3d");

const s=new THREE.Scene();

const cam=new THREE.PerspectiveCamera(
45,1,.1,100
);

cam.position.z=3;

const r=new THREE.WebGLRenderer({
antialias:true,
alpha:true
});

r.setSize(170,170);

c.appendChild(r.domElement);

const o=new THREE.Mesh(
new THREE.IcosahedronGeometry(.75,2),
new THREE.MeshStandardMaterial({
color:0x7c5cff,
metalness:.8,
roughness:.2
})
);

s.add(o);

const l=new THREE.PointLight(
0xffffff,
4
);

l.position.set(2,2,3);

s.add(l);

s.add(
new THREE.AmbientLight(
0xffffff,.7
)
);

(function f(){

requestAnimationFrame(f);

o.rotation.x+=.01;
o.rotation.y+=.015;

r.render(s,cam);

})();

})();
<\/script>`;

  $("frame").srcdoc=
    html.replace(
      "</body>",
      add+"</body>"
    );

  toast("3D preview ON");
};


/* CLEAR */

$("clear").onclick=()=>{

  if(confirm("Clear project?")){

    html="";
    undo=[];
    redo=[];
    picked=[];

    $("code").value="";
    $("frame").srcdoc="";

    localStorage.removeItem(
      "spdp_html"
    );

    renderFiles();

    $("messages").innerHTML=
      `<div class="msg ai">
      Generate a website, then tell me what you want to change.
      </div>`;

    toast("Cleared");
  }
};


/* LOAD */

window.onload=()=>{

  if(
    html &&
    valid(html)
  ){

    preview(html);

    $("code").value=html;
  }
};

</script>

</body>
</html>
