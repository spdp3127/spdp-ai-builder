<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPDP AI — Website Builder</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Inter,Arial,sans-serif;
}

body{
  min-height:100vh;
  background:#050505;
  color:#fff;
  overflow:hidden;
}

body::before{
  content:"";
  position:fixed;
  width:600px;
  height:600px;
  background:radial-gradient(circle,rgba(255,255,255,.07),transparent 65%);
  top:-250px;
  left:-200px;
  pointer-events:none;
}

body::after{
  content:"";
  position:fixed;
  width:500px;
  height:500px;
  background:radial-gradient(circle,rgba(120,120,120,.06),transparent 65%);
  bottom:-250px;
  right:-150px;
  pointer-events:none;
}

/* HEADER */

header{
  height:72px;
  border-bottom:1px solid #1d1d1d;
  background:rgba(8,8,8,.85);
  backdrop-filter:blur(20px);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  position:relative;
  z-index:10;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:38px;
  height:38px;
  border-radius:11px;
  background:linear-gradient(145deg,#fff,#777);
  color:#050505;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-size:15px;
  box-shadow:0 8px 30px rgba(255,255,255,.08);
}

.brand-name{
  font-size:18px;
  font-weight:800;
  letter-spacing:-.5px;
}

.brand-name span{
  color:#777;
  font-weight:500;
}

.header-right{
  display:flex;
  align-items:center;
  gap:10px;
}

.header-btn{
  background:#101010;
  border:1px solid #292929;
  color:#ddd;
  padding:10px 15px;
  border-radius:9px;
  cursor:pointer;
}

.header-btn:hover{
  border-color:#555;
}

.publish{
  background:#fff;
  color:#050505;
  border:0;
  font-weight:800;
  padding:11px 18px;
  border-radius:9px;
  cursor:pointer;
  transition:.2s;
}

.publish:hover{
  transform:translateY(-1px);
  box-shadow:0 8px 30px rgba(255,255,255,.15);
}

/* MAIN */

.app{
  height:calc(100vh - 72px);
  display:grid;
  grid-template-columns:350px 1fr;
}

/* SIDEBAR */

.sidebar{
  background:#080808;
  border-right:1px solid #1c1c1c;
  padding:24px;
  overflow:auto;
}

.small-label{
  color:#777;
  font-size:11px;
  font-weight:700;
  letter-spacing:1.5px;
  text-transform:uppercase;
  margin-bottom:9px;
}

.sidebar h1{
  font-size:25px;
  letter-spacing:-1px;
  margin-bottom:8px;
}

.desc{
  color:#777;
  font-size:13px;
  line-height:1.6;
  margin-bottom:22px;
}

.prompt-box{
  background:#0d0d0d;
  border:1px solid #272727;
  border-radius:14px;
  padding:13px;
  transition:.2s;
}

.prompt-box:focus-within{
  border-color:#555;
  box-shadow:0 0 0 3px rgba(255,255,255,.025);
}

textarea{
  width:100%;
  height:125px;
  resize:none;
  background:transparent;
  border:0;
  outline:0;
  color:#fff;
  font-size:14px;
  line-height:1.6;
}

textarea::placeholder{
  color:#555;
}

.generate{
  width:100%;
  margin-top:10px;
  border:0;
  border-radius:11px;
  padding:14px;
  background:linear-gradient(135deg,#fff,#aaa);
  color:#050505;
  font-size:14px;
  font-weight:900;
  cursor:pointer;
  transition:.2s;
}

.generate:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 35px rgba(255,255,255,.12);
}

.generate:disabled{
  opacity:.5;
  cursor:wait;
  transform:none;
}

.divider{
  height:1px;
  background:#1c1c1c;
  margin:25px 0;
}

.examples-title{
  color:#666;
  font-size:10px;
  font-weight:800;
  letter-spacing:1.4px;
  margin-bottom:11px;
}

.example{
  padding:12px 13px;
  border:1px solid #1d1d1d;
  background:#0c0c0c;
  border-radius:10px;
  margin-bottom:8px;
  color:#aaa;
  font-size:12px;
  cursor:pointer;
  transition:.2s;
}

.example:hover{
  background:#111;
  color:#fff;
  border-color:#333;
  transform:translateX(3px);
}

/* PREVIEW */

.preview{
  display:flex;
  flex-direction:column;
  background:#0b0b0b;
  min-width:0;
}

.preview-top{
  height:55px;
  border-bottom:1px solid #1c1c1c;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
}

.preview-left{
  display:flex;
  align-items:center;
  gap:10px;
  color:#999;
  font-size:12px;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#777;
}

.preview-tools{
  display:flex;
  gap:7px;
}

.tool{
  width:32px;
  height:30px;
  border:1px solid #242424;
  background:#101010;
  color:#888;
  border-radius:7px;
  cursor:pointer;
}

.tool:hover{
  color:#fff;
}

.canvas{
  flex:1;
  padding:25px;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:auto;
}

/* REAL GENERATED WEBSITE PREVIEW */

.website{
  width:min(100%,1050px);
  height:min(100%,700px);
  min-height:520px;
  background:#fff;
  border-radius:14px;
  overflow:hidden;
  box-shadow:
    0 35px 100px rgba(0,0,0,.55),
    0 0 0 1px rgba(255,255,255,.04);
  position:relative;
}

#previewFrame{
  width:100%;
  height:100%;
  min-height:520px;
  border:0;
  display:block;
  background:#fff;
}

/* LOADING */

.loading{
  position:absolute;
  inset:0;
  background:rgba(255,255,255,.96);
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:18px;
  color:#111;
  z-index:5;
}

.loading.show{
  display:flex;
}

.spinner{
  width:42px;
  height:42px;
  border:4px solid #ddd;
  border-top-color:#111;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.loading-text{
  font-size:14px;
  font-weight:800;
}

/* TOAST */

.toast{
  position:fixed;
  bottom:25px;
  right:25px;
  background:#fff;
  color:#111;
  padding:13px 18px;
  border-radius:10px;
  font-size:13px;
  font-weight:700;
  transform:translateY(100px);
  opacity:0;
  transition:.3s;
  z-index:100;
}

.toast.show{
  transform:translateY(0);
  opacity:1;
}

/* MOBILE */

@media(max-width:850px){

  body{
    overflow:auto;
  }

  header{
    padding:0 15px;
  }

  .header-btn{
    display:none;
  }

  .app{
    height:auto;
    grid-template-columns:1fr;
  }

  .sidebar{
    border-right:0;
    border-bottom:1px solid #1c1c1c;
  }

  .preview{
    min-height:700px;
  }

  .website{
    min-height:500px;
  }

  .canvas{
    padding:15px;
  }
}
</style>
</head>

<body>

<header>

  <div class="brand">

    <div class="logo">
      SP
    </div>

    <div class="brand-name">
      SPDP <span>AI</span>
    </div>

  </div>

  <div class="header-right">

    <button
      class="header-btn"
      onclick="newProject()">
      New Project
    </button>

    <button
      class="header-btn"
      onclick="downloadWebsite()">
      Download
    </button>

    <button
      class="publish"
      onclick="publishSite()">
      Publish
    </button>

  </div>

</header>


<div class="app">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="small-label">
      SPDP AI BUILDER
    </div>

    <h1>
      Create with AI.
    </h1>

    <p class="desc">
      Describe your website idea and turn it into
      a beautiful digital experience.
    </p>

    <div class="prompt-box">

      <textarea
        id="prompt"
        placeholder="Describe your website...

Example:
Create a premium website for a
modern technology company."></textarea>

    </div>

    <button
      class="generate"
      id="generateButton"
      onclick="generate()">

      ✦ Generate Website

    </button>


    <div class="divider"></div>


    <div class="examples-title">
      START WITH AN IDEA
    </div>


    <div
      class="example"
      onclick="example('Create a premium gaming website with a dark futuristic design, hero section, features, pricing and contact section')">

      🎮 Premium Gaming Website

    </div>


    <div
      class="example"
      onclick="example('Create a modern restaurant website with menu, about section, reservation button and contact information')">

      🍽 Modern Restaurant

    </div>


    <div
      class="example"
      onclick="example('Create a premium portfolio website for a professional designer with projects and contact section')">

      ✦ Designer Portfolio

    </div>


    <div
      class="example"
      onclick="example('Create a premium technology startup website with a futuristic hero, features, pricing and testimonials')">

      ◈ Technology Startup

    </div>


    <div
      class="example"
      onclick="example('Create a modern online store with products, categories, pricing and shopping buttons')">

      ◉ Online Store

    </div>

  </aside>


  <!-- PREVIEW -->

  <section class="preview">

    <div class="preview-top">

      <div class="preview-left">

        <div class="dot"></div>

        Live Preview

      </div>


      <div class="preview-tools">

        <button
          class="tool"
          onclick="desktopPreview()">

          ▣

        </button>


        <button
          class="tool"
          onclick="mobilePreview()">

          ▯

        </button>

      </div>

    </div>


    <div class="canvas">

      <div class="website" id="website">

        <iframe
          id="previewFrame"
          title="Generated Website Preview"
          sandbox="allow-scripts allow-forms allow-modals">
        </iframe>


        <div
          class="loading"
          id="loading">

          <div class="spinner"></div>

          <div class="loading-text">
            SPDP AI is building your website...
          </div>

        </div>

      </div>

    </div>

  </section>

</div>


<div
  class="toast"
  id="toast">

  Done

</div>


<script>

/* =========================================
   SPDP AI CONFIG
========================================= */

const WORKER_URL =
  "https://spdp-ai.spdp3127.workers.dev/";


let generatedHTML = "";


/* =========================================
   EXAMPLE PROMPTS
========================================= */

function example(text){

  document.getElementById("prompt").value = text;

}


/* =========================================
   REAL AI GENERATION
========================================= */

async function generate(){

  const prompt =
    document.getElementById("prompt").value.trim();

  const button =
    document.getElementById("generateButton");

  const loading =
    document.getElementById("loading");


  if(!prompt){

    showToast(
      "Describe your website first"
    );

    return;

  }


  button.disabled = true;

  loading.classList.add("show");


  try{

    showToast(
      "AI is creating your website..."
    );


    const response =
      await fetch(
        WORKER_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            prompt:`
Create a complete premium,
production-quality website.

User request:

${prompt}

Requirements:

- Modern professional design
- Fully responsive
- Excellent typography
- Beautiful spacing
- Premium visual hierarchy
- Smooth animations
- Navigation bar
- Hero section
- Relevant sections based on the request
- Call-to-action buttons
- Footer
- Mobile responsive layout
- Use HTML, CSS and JavaScript
- Keep everything in ONE HTML file
- Do not use markdown
- Return ONLY the complete HTML document
`
          })

        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "AI request failed"
      );

    }


    if(!data.html){

      throw new Error(
        "AI did not return website code"
      );

    }


    generatedHTML =
      data.html;


    const frame =
      document.getElementById(
        "previewFrame"
      );


    frame.srcdoc =
      generatedHTML;


    loading.classList.remove(
      "show"
    );


    showToast(
      "✨ Website generated successfully!"
    );


  }

  catch(error){

    console.error(error);

    loading.classList.remove(
      "show"
    );


    showToast(
      "AI Error: " +
      error.message
    );

  }


  finally{

    button.disabled = false;

  }

}


/* =========================================
   NEW PROJECT
========================================= */

function newProject(){

  document.getElementById(
    "prompt"
  ).value = "";


  generatedHTML = "";


  const frame =
    document.getElementById(
      "previewFrame"
    );


  frame.srcdoc = `

<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
font-family:Arial,sans-serif;
background:
linear-gradient(135deg,#ffffff,#eeeeee);
color:#111;
text-align:center;
}

.container{
max-width:650px;
padding:40px;
}

.badge{
display:inline-block;
padding:8px 14px;
border:1px solid #ddd;
border-radius:30px;
font-size:12px;
margin-bottom:20px;
}

h1{
font-size:clamp(40px,6vw,70px);
margin:0 0 20px;
letter-spacing:-3px;
}

p{
color:#666;
line-height:1.7;
}

</style>

</head>

<body>

<div class="container">

<div class="badge">
POWERED BY SPDP AI
</div>

<h1>
Build Something Extraordinary.
</h1>

<p>
Describe your idea and let SPDP AI create your website.
</p>

</div>

</body>

</html>

`;

}


/* =========================================
   DESKTOP PREVIEW
========================================= */

function desktopPreview(){

  const website =
    document.getElementById(
      "website"
    );


  website.style.width =
    "min(100%,1050px)";


  website.style.height =
    "min(100%,700px)";


  showToast(
    "Desktop preview"
  );

}


/* =========================================
   MOBILE PREVIEW
========================================= */

function mobilePreview(){

  const website =
    document.getElementById(
      "website"
    );


  website.style.width =
    "390px";


  website.style.height =
    "700px";


  showToast(
    "Mobile preview"
  );

}


/* =========================================
   DOWNLOAD GENERATED WEBSITE
========================================= */

function downloadWebsite(){

  if(!generatedHTML){

    showToast(
      "Generate a website first"
    );

    return;

  }


  const blob =
    new Blob(
      [generatedHTML],
      {
        type:"text/html"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement("a");


  a.href = url;

  a.download =
    "spdp-generated-website.html";


  document.body.appendChild(a);

  a.click();

  a.remove();


  URL.revokeObjectURL(url);


  showToast(
    "Website downloaded!"
  );

}


/* =========================================
   PUBLISH
========================================= */

function publishSite(){

  if(!generatedHTML){

    showToast(
      "Generate a website first"
    );

    return;

  }


  showToast(
    "Publish system coming next 🚀"
  );

}


/* =========================================
   TOAST
========================================= */

function showToast(message){

  const toast =
    document.getElementById(
      "toast"
    );


  toast.innerText =
    message;


  toast.classList.add(
    "show"
  );


  setTimeout(
    ()=>{
      toast.classList.remove(
        "show"
      );
    },
    2500
  );

}


/* =========================================
   START SCREEN
========================================= */

newProject();

</script>

</body>
</html>
