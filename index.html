<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
/>
<meta
  name="theme-color"
  content="#070707"
/>

<title>SPDP AI — AI Website Builder</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#060606;
  color:#fff;
  font-family:Inter,Arial,sans-serif;
}

button,
textarea,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.app{
  width:100%;
  height:100vh;
  display:flex;
}

.sidebar{
  width:238px;
  flex:none;
  background:#090909;
  border-right:1px solid #202020;
  display:flex;
  flex-direction:column;
  padding:14px 12px;
}

.brand{
  display:flex;
  gap:10px;
  align-items:center;
  padding:7px 8px 22px;
}

.brandIcon{
  width:38px;
  height:38px;
  border-radius:11px;
  display:grid;
  place-items:center;
  background:linear-gradient(
    135deg,
    #ffffff,
    #777
  );
  color:#000;
  font-weight:950;
}

.brandTitle{
  font-size:14px;
  font-weight:850;
}

.brandSub{
  margin-top:2px;
  font-size:8px;
  letter-spacing:1px;
  color:#666;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:3px;
}

.navBtn{
  width:100%;
  border:0;
  background:transparent;
  color:#888;
  text-align:left;
  padding:11px;
  border-radius:9px;
}

.navBtn:hover,
.navBtn.active{
  background:#181818;
  color:#fff;
}

.sidebarBottom{
  margin-top:auto;
  border-top:1px solid #202020;
  padding:14px 8px;
  font-size:11px;
  color:#666;
}

.online{
  color:#42dc86;
}

.main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:61px;
  flex:none;
  border-bottom:1px solid #202020;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
}

.topTitle{
  font-weight:800;
}

.status{
  color:#777;
  font-size:12px;
}

.workspace{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:350px minmax(0,1fr);
}

.left{
  min-width:0;
  min-height:0;
  border-right:1px solid #202020;
  padding:14px;
  display:flex;
  flex-direction:column;
}

.label{
  color:#666;
  font-size:10px;
  letter-spacing:1px;
  text-transform:uppercase;
  margin:3px 0 8px;
}

.prompt{
  height:125px;
  width:100%;
  resize:none;
  outline:none;
  background:#101010;
  color:#fff;
  border:1px solid #292929;
  border-radius:12px;
  padding:13px;
}

.prompt:focus,
.chatInput:focus,
.code:focus{
  border-color:#765cff;
}

.row{
  display:flex;
  gap:7px;
  margin-top:8px;
}

.btn{
  border:1px solid #2b2b2b;
  background:#111;
  color:#ddd;
  border-radius:9px;
  padding:9px 11px;
}

.btn:hover{
  background:#191919;
}

.primary{
  background:#7057e8;
  border-color:#7057e8;
  color:#fff;
}

.primary:hover{
  background:#8069f2;
}

.generate{
  width:100%;
  margin-top:8px;
}

.attachments{
  display:none;
  gap:6px;
  flex-wrap:wrap;
  margin-top:8px;
  max-height:70px;
  overflow:auto;
}

.attachments.show{
  display:flex;
}

.attachment{
  background:#111;
  border:1px solid #292929;
  color:#aaa;
  border-radius:7px;
  padding:6px 8px;
  font-size:10px;
}

.chat{
  flex:1;
  min-height:0;
  margin-top:12px;
  border:1px solid #232323;
  border-radius:12px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.chatHeader{
  padding:10px;
  border-bottom:1px solid #232323;
  font-size:12px;
}

.chatSub{
  color:#666;
  font-size:10px;
  margin-top:3px;
}

.messages{
  flex:1;
  min-height:0;
  overflow:auto;
  padding:9px;
}

.message{
  padding:9px 10px;
  border-radius:9px;
  margin-bottom:7px;
  font-size:12px;
  line-height:1.45;
  white-space:pre-wrap;
}

.message.ai{
  background:#111;
  color:#aaa;
}

.message.user{
  background:#211b3d;
  color:#eee;
}

.chatInput{
  width:100%;
  height:70px;
  resize:none;
  border:0;
  border-top:1px solid #232323;
  outline:0;
  padding:10px;
  background:#0e0e0e;
  color:#fff;
}

.chatFooter{
  padding:7px;
  border-top:1px solid #232323;
}

.right{
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
}

.toolbar{
  min-height:52px;
  border-bottom:1px solid #202020;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:7px;
}

.toolGroup{
  display:flex;
  gap:5px;
  overflow:auto;
}

.tool{
  white-space:nowrap;
  background:#111;
  border:1px solid #292929;
  color:#999;
  border-radius:8px;
  padding:7px 9px;
  font-size:11px;
}

.tool:hover,
.tool.active{
  color:#fff;
  background:#1c1c1c;
}

.previewArea{
  flex:1;
  min-height:0;
  overflow:auto;
  background:#050505;
  padding:14px;
  display:flex;
  justify-content:center;
}

.frame{
  width:100%;
  height:100%;
  min-height:450px;
  border:1px solid #292929;
  border-radius:9px;
  background:#fff;
  flex:none;
}

.codePanel{
  display:none;
  height:46%;
  min-height:220px;
  border-top:1px solid #222;
  flex-direction:column;
}

.codePanel.show{
  display:flex;
}

.codeHeader{
  height:40px;
  flex:none;
  background:#0b0b0b;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 10px;
  font-size:12px;
}

.code{
  flex:1;
  min-height:0;
  width:100%;
  resize:none;
  outline:0;
  border:0;
  padding:13px;
  background:#050505;
  color:#ddd;
  font:13px/1.5 Consolas,monospace;
}

.codeFooter{
  padding:7px;
  border-top:1px solid #222;
  background:#0b0b0b;
  text-align:right;
}

.menu{
  position:fixed;
  z-index:100;
  display:none;
  background:#111;
  border:1px solid #333;
  border-radius:10px;
  padding:5px;
  box-shadow:0 20px 50px #000;
}

.menu.show{
  display:block;
}

.menu button{
  width:190px;
  border:0;
  background:transparent;
  color:#ddd;
  padding:10px;
  border-radius:7px;
  text-align:left;
}

.menu button:hover{
  background:#1d1d1d;
}

.toast{
  position:fixed;
  z-index:999;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  display:none;
  background:#171717;
  border:1px solid #333;
  color:#fff;
  padding:9px 13px;
  border-radius:9px;
  font-size:12px;
}

.toast.show{
  display:block;
}

@media(max-width:850px){

  .sidebar{
    display:none;
  }

  .workspace{
    grid-template-columns:1fr;
  }

  .left{
    display:none;
  }
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar">

    <div class="brand">

      <div class="brandIcon">
        S
      </div>

      <div>
        <div class="brandTitle">
          SPDP AI
        </div>

        <div class="brandSub">
          AI WEBSITE BUILDER
        </div>
      </div>

    </div>

    <nav class="nav">

      <button
        class="navBtn active"
        id="builderNav"
      >
        ✦ Builder
      </button>

      <button
        class="navBtn"
        id="codeNav"
      >
        ⌘ Code
      </button>

      <button
        class="navBtn"
        id="previewNav"
      >
        ◉ Preview
      </button>

      <button
        class="navBtn"
        id="assetsNav"
      >
        ▣ Assets
      </button>

    </nav>

    <div class="sidebarBottom">
      Cloudflare Workers AI
      <br>
      <span class="online">
        ● AI Online
      </span>
    </div>

  </aside>


  <main class="main">

    <header class="topbar">

      <div class="topTitle">
        AI Website Builder
      </div>

      <div class="status">
        <span class="online">●</span>
        Connected
      </div>

    </header>


    <div class="workspace">

      <section class="left">

        <div class="label">
          Website prompt
        </div>

        <textarea
          id="prompt"
          class="prompt"
          placeholder="Create a playable Flappy Bird game with a premium dark UI, animated bird, pipes, score, high score and restart button..."
        ></textarea>


        <div class="row">

          <button
            id="addBtn"
            class="btn"
          >
            ＋ Add
          </button>

          <button
            id="clearBtn"
            class="btn"
          >
            Clear
          </button>

        </div>


        <button
          id="generateBtn"
          class="btn primary generate"
        >
          Generate Website
        </button>


        <div
          id="attachments"
          class="attachments"
        ></div>


        <input
          id="imageInput"

        />

        <input

        <div class="chat">

          <div class="chatHeader">

            <b>

          </div>


          <div

          >

              Generate a website first. Then tell me what you want to change.
            </div>

              ◇ 3D

            <button

              class="tool"

            </button>

            <button
              id="tabletBtn"

            >
              Tablet
            </button>

              Mobile

          </div>


          <div class="toolGroup">

            <button
              id="undoBtn"

              ↶

              ↷

        <div
          id="codePanel"
          class="codePanel"
        >

          <div class="codeHeader">

            <b>
              HTML / CSS / JS

              id="copyCodeBtn"

              Copy Code

  </main>

</div>


<div
  id="menu"
  class="menu"
>

  <button data-file="image">
    🖼️ Image
  </button>

  <button data-file="video">
    🎬 Video
  </button>

  <button data-file="file">
    📄 File
  </button>

</div>


<div
  id="toast"
  class="toast"
></div>


<script>
"use strict";


/* =========================================================
   CONFIG
========================================================= */

const WORKER_URL =
  "https://spdp-ai.spdp3127.workers.dev/";


/* =========================================================
   DOM
========================================================= */

const $ =
  id => document.getElementById(id);


/* =========================================================
   STATE
========================================================= */

let html =
  localStorage.getItem("spdp_html") || "";

let undoStack = [];
let redoStack = [];

let selectedFiles = [];

let previewEditing = false;


/* =========================================================
   TOAST
========================================================= */

function toast(text){

  const el = $("toast");

  el.textContent = text;

  el.classList.add("show");

  clearTimeout(
    window.__toastTimer
  );

  window.__toastTimer =
    setTimeout(() => {
      el.classList.remove("show");
    }, 2600);
}


/* =========================================================
   MESSAGES
========================================================= */

function message(type,text){

  const el =
    document.createElement("div");

  el.className =
    "message " + type;

  el.textContent = text;

  $("messages")
    .appendChild(el);

  $("messages").scrollTop =
    $("messages").scrollHeight;
}


/* =========================================================
   HTML CLEAN
========================================================= */

function cleanHTML(value){

  let s =
    String(value || "")
      .trim();

  s =
    s.replace(
      /^```html\s*/i,
      ""
    );

  s =
    s.replace(
      /^```javascript\s*/i,
      ""
    );

  s =
    s.replace(
      /^```js\s*/i,
      ""
    );

  s =
    s.replace(
      /^```\s*/i,
      ""
    );

  s =
    s.replace(
      /\s*```$/i,
      ""
    );

  const lower =
    s.toLowerCase();

  let start =
    lower.indexOf(
      "<!doctype html"
    );

  if(start < 0){
    start =
      lower.indexOf("<html");
  }

  if(start >= 0){
    s =
      s.substring(start);
  }

  const end =
    s
      .toLowerCase()
      .lastIndexOf("</html>");

  if(end >= 0){
    s =
      s.substring(
        0,
        end + 7
      );
  }

  return s.trim();
}


/* =========================================================
   HTML VALIDATION
========================================================= */

function validHTML(value){

  const s =
    String(value || "")
      .trim()
      .toLowerCase();

  if(!(
    s.startsWith("<!doctype html") ||
    s.startsWith("<html")
  )){
    return false;
  }

  return (
    s.includes("<head") &&
    s.includes("</head>") &&
    s.includes("<body") &&
    s.includes("</body>") &&
    s.includes("</html>")
  );
}


/* =========================================================
   PREVIEW
========================================================= */

function renderPreview(value){

  $("preview").srcdoc =
    value || "";
}


/* =========================================================
   SET HTML
========================================================= */

function setHTML(
  value,
  saveHistory = true
){

  const clean =
    cleanHTML(value);

  if(!validHTML(clean)){
    toast(
      "❌ Invalid or incomplete HTML"
    );

    return false;
  }

  if(
    saveHistory &&
    html &&
    html !== clean
  ){
    undoStack.push(html);

    if(
      undoStack.length > 30
    ){
      undoStack.shift();
    }
  }

  redoStack = [];

  html = clean;

  $("code").value = html;

  renderPreview(html);

  localStorage.setItem(
    "spdp_html",
    html
  );

  return true;
}


/* =========================================================
   API
========================================================= */

async function api(payload){

  let response;

  try{

    response =
      await fetch(
        WORKER_URL,
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:
            JSON.stringify(payload)
        }
      );

  }catch(error){

    throw new Error(
      "Could not connect to SPDP AI Worker."
    );
  }


  const text =
    await response.text();

  let data;

  try{

    data =
      JSON.parse(text);

  }catch{

    console.error(
      "RAW WORKER RESPONSE:",
      text
    );

    throw new Error(
      "Worker returned invalid JSON."
    );
  }


  if(
    !response.ok ||
    data.success !== true
  ){

    throw new Error(
      data.error ||
      "AI request failed."
    );
  }


  return data;
}


/* =========================================================
   ADD MENU
========================================================= */

$("addBtn").onclick =
  event => {

    const rect =
      $("addBtn")
        .getBoundingClientRect();

    $("menu").style.left =
      rect.left + "px";

    $("menu").style.top =
      (rect.top - 125) + "px";

    $("menu")
      .classList
      .toggle("show");

    event.stopPropagation();
  };


document.addEventListener(
  "click",
  event => {

    if(
      !event.target.closest(
        "#menu"
      ) &&
      !event.target.closest(
        "#addBtn"
      )
    ){

      $("menu")
        .classList
        .remove("show");
    }
  }
);


/* =========================================================
   FILE PICKERS
========================================================= */

document
  .querySelectorAll(
    "[data-file]"
  )
  .forEach(button => {

    button.onclick = () => {

      const type =
        button.dataset.file;

      $("menu")
        .classList
        .remove("show");

      if(type === "image"){
        $("imageInput").click();
      }

      if(type === "video"){
        $("videoInput").click();
      }

      if(type === "file"){
        $("fileInput").click();
      }
    };
  });


[
  "imageInput",
  "videoInput",
  "fileInput"
]
.forEach(id => {

  $(id).onchange =
    event => {

      selectedFiles.push(
        ...Array.from(
          event.target.files || []
        )
      );

      renderAttachments();

      event.target.value = "";
    };
});


function renderAttachments(){

  const box =
    $("attachments");

  box.innerHTML = "";

  box.classList.toggle(
    "show",
    selectedFiles.length > 0
  );

  selectedFiles.forEach(
    (file,index) => {

      const item =
        document.createElement("div");

      item.className =
        "attachment";

      item.textContent =
        "✓ " +
        file.name +
        " ×";

      item.onclick = () => {

        selectedFiles.splice(
          index,
          1
        );

        renderAttachments();
      };

      box.appendChild(item);
    }
  );
}


/* =========================================================
   GENERATE
========================================================= */

$("generateBtn").onclick =
  async () => {

    const prompt =
      $("prompt")
        .value
        .trim();

    if(!prompt){

      toast(
        "Write a website prompt first."
      );

      return;
    }


    const button =
      $("generateBtn");

    button.disabled = true;

    button.textContent =
      "Generating...";


    message(
      "user",
      prompt
    );


    try{

      const attachments =
        selectedFiles.map(
          file => ({
            name:file.name,
            type:file.type,
            size:file.size
          })
        );


      const data =
        await api({
          action:"create",
          prompt,
          currentHTML:"",
          attachments
        });


      const generated =
        cleanHTML(
          data.html
        );


      if(!validHTML(generated)){

        throw new Error(
          "AI generated an incomplete website."
        );
      }


      undoStack = [];
      redoStack = [];


      if(
        !setHTML(
          generated,
          false
        )
      ){

        throw new Error(
          "AI generated an incomplete website."
        );
      }


      message(
        "ai",
        "✓ Website generated successfully."
      );

      toast(
        "Website ready"
      );


    }catch(error){

      console.error(error);

      message(
        "ai",
        "❌ " +
        error.message
      );

      toast(
        error.message
      );

    }finally{

      button.disabled = false;

      button.textContent =
        "Generate Website";
    }
  };


/* =========================================================
   AI EDIT
========================================================= */

$("chatBtn").onclick =
  async () => {

    const instruction =
      $("chatInput")
        .value
        .trim();

    if(!instruction){
      return;
    }

    if(!html){

      toast(
        "Generate a website first."
      );

      return;
    }


    const button =
      $("chatBtn");

    button.disabled = true;

    button.textContent =
      "AI Working...";


    message(
      "user",
      instruction
    );


    try{

      const data =
        await api({
          action:"edit",
          prompt:instruction,
          currentHTML:html
        });


      const updated =
        cleanHTML(
          data.html
        );


      if(!validHTML(updated)){

        throw new Error(
          "AI generated an incomplete website."
        );
      }


      if(
        !setHTML(
          updated,
          true
        )
      ){

        throw new Error(
          "AI generated an incomplete website."
        );
      }


      $("chatInput")
        .value = "";


      message(
        "ai",

/* =========================================================
   DOWNLOAD
========================================================= */

$("downloadBtn").onclick =
  () => {

    if(!html){

      toast(
        "No website to download."
      );

      return;
    }


    const blob =
      new Blob(
        [html],
        {
          type:
            "text/html;charset=utf-8"
        }
      );


    const url =
      URL.createObjectURL(blob);


    const link =
      document.createElement("a");

    link.href = url;

    link.download =
      "spdp-ai-website.html";

    document.body
      .appendChild(link);

    link.click();

    link.remove();

    setTimeout(
      () => URL.revokeObjectURL(url),
      1000
    );
  };

/* =========================================================
   PREVIEW EDIT
========================================================= */

$("previewEditBtn").onclick =
  () => {

    if(!html){

      toast(
        "Generate a website first."
      );

      return;
    }


    previewEditing =
      !previewEditing;


    $("previewEditBtn")
      .classList
      .toggle(
        "active",
        previewEditing
      );


    const injected = `

<style>
body.spdp-edit-mode *{
  cursor:pointer!important;
}

body.spdp-edit-mode *:hover{
  outline:2px dashed #765cff!important;
  outline-offset:2px;
}
</style>

<script>
(function(){

  let enabled = false;

  window.addEventListener(
    "message",
    function(event){

      if(
        event.data &&
        event.data.type === "SPDP_EDIT"
      ){

        enabled =
          !!event.data.enabled;

        document.body
          .classList
          .toggle(
            "spdp-edit-mode",
            enabled
          );
      }

    }
  );


  document.addEventListener(
    "click",
    function(event){

      if(!enabled){
        return;
      }

      const element =
        event.target;

      if(
        !element ||
        element === document.body ||
        element === document.documentElement
      ){
        return;
      }


      event.preventDefault();

      element.contentEditable =
        "true";

      element.focus();


      element.onblur =
        function(){

          element.contentEditable =
            "false";

          parent.postMessage(
            {
              type:"SPDP_SAVE",
              html:
                "<!DOCTYPE html>" +
                document.documentElement
                  .outerHTML
            },
            "*"
          );
        };

    }
  );

})();
<\/script>
`;


    $("preview").srcdoc =
      html.replace(
        "</body>",
        injected +
        "</body>"
      );


    setTimeout(
      () => {

        try{

          $("preview")
            .contentWindow
            .postMessage(
              {
                type:"SPDP_EDIT",
                enabled:
                  previewEditing
              },
              "*"
            );

        }catch{}

      },
      150
    );


    toast(
      previewEditing
        ? "Preview edit ON"
        : "Preview edit OFF"
    );
  };

$("threeBtn").onclick =
  () => {

    if(!html){

    }


    const addon = `

<script
src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js">
<\/script>

<style>

#spdp3dwidget{
  position:fixed;
  right:18px;
  bottom:18px;
  width:180px;
  height:180px;
  border-radius:18px;
  overflow:hidden;
  background:#050505;
  border:1px solid #333;
  z-index:999999;
}

</style>

<div id="spdp3dwidget"></div>

<script>

(function(){

  if(!window.THREE){
    return;
  }

  const root =
    document.getElementById(
      "spdp3dwidget"
    );

  if(!root){
    return;
  }


  const scene =
    new THREE.Scene();


  const camera =
    new THREE.PerspectiveCamera(
      45,
      1,
      0.1,
      100
    );


  camera.position.z = 3;


  const renderer =
    new THREE.WebGLRenderer({
      antialias:true,
      alpha:true
    });


  renderer.setSize(
    180,
    180
  );


  root.appendChild(
    renderer.domElement
  );


  const mesh =
    new THREE.Mesh(
      new THREE.IcosahedronGeometry(
        0.75,
        2
      ),
      new THREE.MeshStandardMaterial({
        color:0x765cff,
        metalness:0.85,
        roughness:0.2
      })
    );


  scene.add(mesh);


  const light =
    new THREE.PointLight(
      0xffffff,
      4
    );


  light.position.set(
    2,
    2,
    3
  );


  scene.add(light);


  scene.add(
    new THREE.AmbientLight(
      0xffffff,
      0.8
    )
  );


  function animate(){

    requestAnimationFrame(
      animate
    );

    mesh.rotation.x += 0.01;
    mesh.rotation.y += 0.015;

    renderer.render(
      scene,
      camera
    );
  }


  animate();

})();

<\/script>
`;


    $("preview").srcdoc =
