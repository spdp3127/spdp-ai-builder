<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SPDP AI — Website Builder</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      overflow-x: hidden;
      overflow-y: auto;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
      background: #070707;
      color: #fff;
      font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      min-height: 70px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid #202020;
      background: rgba(8, 8, 8, 0.96);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(16px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-weight: 800;
      letter-spacing: -0.4px;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background:
        linear-gradient(
          135deg,
          #fff,
          #777
        );
      color: #000;
      font-weight: 1000;
      box-shadow:
        0 0 30px rgba(255,255,255,.12);
    }

    .brand small {
      display: block;
      color: #777;
      font-size: 10px;
      margin-top: 2px;
      font-weight: 500;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #aaa;
      font-size: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #42ff88;
      box-shadow: 0 0 12px #42ff88;
    }

    .main {
      flex: 1;
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr);
      min-height: calc(100vh - 70px);
    }

    .sidebar {
      border-right: 1px solid #202020;
      background: #0b0b0b;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0;
    }

    .label {
      color: #8e8e8e;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    textarea {
      width: 100%;
      min-height: 170px;
      resize: vertical;
      border: 1px solid #292929;
      border-radius: 16px;
      outline: none;
      background: #111;
      color: #fff;
      padding: 15px;
      line-height: 1.55;
      font-size: 13px;
    }

    textarea:focus {
      border-color: #555;
      box-shadow:
        0 0 0 3px rgba(255,255,255,.04);
    }

    .generate {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 14px 16px;
      background: #fff;
      color: #000;
      font-weight: 900;
      transition: .2s ease;
    }

    .generate:hover {
      transform: translateY(-1px);
      box-shadow:
        0 12px 35px rgba(255,255,255,.12);
    }

    .generate:disabled {
      opacity: .5;
      cursor: wait;
      transform: none;
    }

    .subchat {
      margin-top: 4px;
      padding-top: 16px;
      border-top: 1px solid #202020;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .subchat textarea {
      min-height: 105px;
    }

    .edit-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    .edit-btn,
    .secondary {
      border: 1px solid #292929;
      border-radius: 12px;
      padding: 11px 14px;
      background: #151515;
      color: #fff;
      font-weight: 700;
    }

    .edit-btn:hover,
    .secondary:hover {
      background: #202020;
    }

    .workspace {
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: #080808;
    }

    .toolbar {
      min-height: 58px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid #202020;
      overflow-x: auto;
    }

    .toolbar button {
      white-space: nowrap;
    }

    .view-btn {
      border: 1px solid #292929;
      border-radius: 10px;
      padding: 9px 12px;
      background: #111;
      color: #aaa;
      font-size: 12px;
      font-weight: 700;
    }

    .view-btn.active,
    .view-btn:hover {
      color: #fff;
      background: #1a1a1a;
    }

    .spacer {
      flex: 1;
    }

    .preview-wrap {
      flex: 1;
      min-height: 600px;
      position: relative;
      background: #111;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      min-height: 600px;
      display: block;
      border: 0;
      background: #fff;
    }

    .code-panel {
      display: none;
      position: absolute;
      inset: 0;
      overflow: auto;
      background: #050505;
      color: #e7e7e7;
      padding: 22px;
    }

    .code-panel.show {
      display: block;
    }

    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-family:
        Consolas,
        Monaco,
        monospace;
      font-size: 12px;
      line-height: 1.55;
    }

    .empty {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #666;
      text-align: center;
      padding: 30px;
      pointer-events: none;
    }

    .empty strong {
      display: block;
      color: #aaa;
      font-size: 20px;
      margin-bottom: 8px;
    }

    .error {
      margin-top: 2px;
      padding: 11px 12px;
      border-radius: 12px;
      background: #241010;
      border: 1px solid #4b2020;
      color: #ff9c9c;
      font-size: 12px;
      line-height: 1.45;
      display: none;
    }

    .error.show {
      display: block;
    }

    .provider {
      color: #777;
      font-size: 10px;
      text-align: center;
    }

    @media (max-width: 900px) {
      .main {
        grid-template-columns: 1fr;
      }

      .sidebar {
        border-right: 0;
        border-bottom: 1px solid #202020;
      }

      .preview-wrap,
      iframe {
        min-height: 70vh;
      }
    }

    @media (max-width: 600px) {
      .topbar {
        padding: 10px 12px;
      }

      .status {
        display: none;
      }

      .sidebar {
        padding: 13px;
      }

      .edit-row {
        grid-template-columns: 1fr;
      }

      .toolbar {
        padding: 8px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="brand-logo">S</div>
      <div>
        SPDP AI
        <small>Website · App · Game Builder</small>
      </div>
    </div>

    <div class="status">
      <span class="status-dot"></span>
      AI Builder Online
    </div>
  </header>

  <main class="main">

    <aside class="sidebar">

      <div class="label">Create</div>

      <textarea
        id="prompt"
        placeholder="Describe the website you want...

Example:
Create a premium black 3D gaming website with an animated hero, games section, features, pricing and footer."
      ></textarea>

      <button
        class="generate"
        id="generateBtn"
      >
        ✦ Generate Website
      </button>

      <div
        class="error"
        id="errorBox"
      ></div>

      <div class="subchat">

        <div class="label">
          Sub-chat Edit
        </div>

        <textarea
          id="editPrompt"
          placeholder="Example:
Make the hero blue, add a pricing section, change the navbar..."
        ></textarea>

        <div class="edit-row">

          <button
            class="edit-btn"
            id="editBtn"
          >
            ✦ Update Website
          </button>

          <button
            class="secondary"
            id="clearBtn"
          >
            Clear
          </button>

        </div>

        <div
          class="provider"
          id="provider"
        >
          Ready
        </div>

      </div>

    </aside>

    <section class="workspace">

      <div class="toolbar">

        <button
          class="view-btn active"
          id="previewBtn"
        >
          Preview
        </button>

        <button
          class="view-btn"
          id="codeBtn"
        >
          Code
        </button>

        <div class="spacer"></div>

        <button
          class="view-btn"
          id="copyBtn"
        >
          Copy
        </button>

        <button
          class="view-btn"
          id="downloadBtn"
        >
          Download
        </button>

        <button
          class="view-btn"
          id="openBtn"
        >
          Open
        </button>

      </div>

      <div class="preview-wrap">

        <iframe
          id="preview"
          title="Generated Website Preview"
          sandbox="allow-scripts allow-forms allow-modals allow-popups allow-same-origin"
        ></iframe>

        <div
          class="code-panel"
          id="codePanel"
        >
          <pre id="code"></pre>
        </div>

        <div
          class="empty"
          id="emptyState"
        >
          <div>
            <strong>SPDP AI</strong>
            Describe your website and press Generate.
          </div>
        </div>

      </div>

    </section>

  </main>

</div>

<script>
  const WORKER_URL =
    "https://spdp-ai.spdp3127.workers.dev/";

  const promptInput =
    document.getElementById("prompt");

  const editInput =
    document.getElementById("editPrompt");

  const generateBtn =
    document.getElementById("generateBtn");

  const editBtn =
    document.getElementById("editBtn");

  const clearBtn =
    document.getElementById("clearBtn");

  const preview =
    document.getElementById("preview");

  const codePanel =
    document.getElementById("codePanel");

  const code =
    document.getElementById("code");

  const emptyState =
    document.getElementById("emptyState");

  const errorBox =
    document.getElementById("errorBox");

  const provider =
    document.getElementById("provider");

  const previewBtn =
    document.getElementById("previewBtn");

  const codeBtn =
    document.getElementById("codeBtn");

  const copyBtn =
    document.getElementById("copyBtn");

  const downloadBtn =
    document.getElementById("downloadBtn");

  const openBtn =
    document.getElementById("openBtn");

  let currentHTML = "";

  function showError(message) {
    errorBox.textContent =
      "❌ " + message;

    errorBox.classList.add("show");
  }

  function hideError() {
    errorBox.textContent = "";
    errorBox.classList.remove("show");
  }

  function showPreview() {
    preview.style.display = "block";
    codePanel.classList.remove("show");

    previewBtn.classList.add("active");
    codeBtn.classList.remove("active");
  }

  function showCode() {
    preview.style.display = "none";
    codePanel.classList.add("show");

    previewBtn.classList.remove("active");
    codeBtn.classList.add("active");

    code.textContent = currentHTML || "";
  }

  function setLoading(button, loading, text) {
    if (loading) {
      button.disabled = true;
      button.dataset.oldText =
        button.textContent;
      button.textContent = text;
    } else {
      button.disabled = false;
      button.textContent =
        button.dataset.oldText ||
        button.textContent;
    }
  }

  async function callWorker(payload) {
    const response = await fetch(
      WORKER_URL,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      }
    );

    const raw =
      await response.text();

    let data;

    try {
      data = JSON.parse(raw);
    } catch {
      throw new Error(
        "Worker returned invalid JSON. HTTP " +
        response.status
      );
    }

    if (!response.ok || !data.success) {
      let message =
        data?.error ||
        "AI request failed.";

      if (data?.details) {
        if (
          typeof data.details === "object"
        ) {
          message +=
            " " +
            Object.entries(
              data.details
            )
              .map(
                ([key, value]) =>
                  key + ": " + value
              )
              .join(" | ");
        } else {
          message +=
            " " +
            String(data.details);
        }
      }

      throw new Error(message);
    }

    if (
      typeof data.html !== "string" ||
      !data.html.trim()
    ) {
      throw new Error(
        "Worker returned empty HTML."
      );
    }

    return data;
  }

  async function generateWebsite() {
    const prompt =
      promptInput.value.trim();

    if (!prompt) {
      showError(
        "Enter a website prompt first."
      );
      promptInput.focus();
      return;
    }

    hideError();

    setLoading(
      generateBtn,
      true,
      "Generating..."
    );

    provider.textContent =
      "AI is generating your website...";

    try {
      const data =
        await callWorker({
          action: "create",
          prompt: prompt
        });

      currentHTML =
        data.html;

      preview.srcdoc =
        currentHTML;

      code.textContent =
        currentHTML;

      emptyState.style.display =
        "none";

      showPreview();

      provider.textContent =
        "Generated with " +
        (
          data.provider ||
          "AI"
        );
    } catch (error) {
      console.error(error);

      showError(
        error?.message ||
        "Generation failed."
      );

      provider.textContent =
        "Generation failed";
    } finally {
      setLoading(
        generateBtn,
        false
      );
    }
  }

  async function editWebsite() {
    if (!currentHTML) {
      showError(
        "Generate a website first."
      );
      return;
    }

    const instruction =
      editInput.value.trim();

    if (!instruction) {
      showError(
        "Enter an edit request."
      );
      editInput.focus();
      return;
    }

    hideError();

    setLoading(
      editBtn,
      true,
      "Updating..."
    );

    provider.textContent =
      "Updating website...";

    try {
      const data =
        await callWorker({
          action: "edit",
          prompt: instruction,
          currentHTML: currentHTML
        });

      currentHTML =
        data.html;

      preview.srcdoc =
        currentHTML;

      code.textContent =
        currentHTML;

      showPreview();

      editInput.value = "";

      provider.textContent =
        "Updated with " +
        (
          data.provider ||
          "AI"
        );
    } catch (error) {
      console.error(error);

      showError(
        error?.message ||
        "Website update failed."
      );

      provider.textContent =
        "Update failed";
    } finally {
      setLoading(
        editBtn,
        false
      );
    }
  }

  async function copyCode() {
    if (!currentHTML) {
      showError(
        "No generated website code."
      );
      return;
    }

    try {
      await navigator.clipboard.writeText(
        currentHTML
      );

      provider.textContent =
        "Code copied";
    } catch {
      showError(
        "Could not copy the code."
      );
    }
  }

  function downloadCode() {
    if (!currentHTML) {
      showError(
        "No generated website code."
      );
      return;
    }

    const blob =
      new Blob(
        [currentHTML],
        {
          type: "text/html;charset=utf-8"
        }
      );

    const url =
      URL.createObjectURL(blob);

    const a =
      document.createElement("a");

    a.href = url;
    a.download =
      "spdp-ai-website.html";

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(url);

    provider.textContent =
      "HTML downloaded";
  }

  function openWebsite() {
    if (!currentHTML) {
      showError(
        "No generated website."
      );
      return;
    }

    const blob =
      new Blob(
        [currentHTML],
        {
          type: "text/html"
        }
      );

    const url =
      URL.createObjectURL(blob);

    window.open(
      url,
      "_blank",
      "noopener,noreferrer"
    );

    setTimeout(
      () =>
        URL.revokeObjectURL(url),
      60000
    );
  }

  generateBtn.addEventListener(
    "click",
    generateWebsite
  );

  editBtn.addEventListener(
    "click",
    editWebsite
  );

  clearBtn.addEventListener(
    "click",
    () => {
      editInput.value = "";
      hideError();
    }
  );

  previewBtn.addEventListener(
    "click",
    showPreview
  );

  codeBtn.addEventListener(
    "click",
    showCode
  );

  copyBtn.addEventListener(
    "click",
    copyCode
  );

  downloadBtn.addEventListener(
    "click",
    downloadCode
  );

  openBtn.addEventListener(
    "click",
    openWebsite
  );

  promptInput.addEventListener(
    "keydown",
    (event) => {
      if (
        event.key === "Enter" &&
        (event.ctrlKey ||
          event.metaKey)
      ) {
        generateWebsite();
      }
    }
  );

  editInput.addEventListener(
    "keydown",
    (event) => {
      if (
        event.key === "Enter" &&
        (event.ctrlKey ||
          event.metaKey)
      ) {
        editWebsite();
      }
    }
  );
</script>

</body>
</html>
