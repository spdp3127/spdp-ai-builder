<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SPDP AI — Website Builder</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #050505;
      color: #ffffff;
    }

    body {
      overflow-x: hidden;
      overflow-y: auto;
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 64px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-bottom: 1px solid #202020;
      background: rgba(5, 5, 5, 0.94);
      backdrop-filter: blur(18px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .logo {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: linear-gradient(
        135deg,
        #ffffff,
        #777777
      );
      color: #000000;
      font-size: 14px;
      font-weight: 900;
    }

    .brand span {
      font-size: 17px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: #9b9b9b;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #38e879;
      box-shadow: 0 0 12px rgba(56, 232, 121, 0.8);
    }

    .workspace {
      flex: 1;
      min-height: calc(100vh - 64px);
      display: grid;
      grid-template-columns: 390px minmax(0, 1fr);
    }

    .sidebar {
      min-width: 0;
      border-right: 1px solid #202020;
      background: #080808;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .panel {
      padding: 20px;
      border-bottom: 1px solid #1b1b1b;
    }

    .panel-title {
      margin-bottom: 12px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1.4px;
      color: #858585;
      font-weight: 800;
    }

    textarea {
      width: 100%;
      min-height: 170px;
      resize: vertical;
      border: 1px solid #292929;
      border-radius: 14px;
      padding: 15px;
      background: #101010;
      color: #ffffff;
      outline: none;
      line-height: 1.55;
    }

    textarea:focus {
      border-color: #555555;
      box-shadow:
        0 0 0 3px rgba(255,255,255,0.04);
    }

    textarea::placeholder {
      color: #666666;
    }

    .primary {
      width: 100%;
      margin-top: 12px;
      border: 0;
      border-radius: 13px;
      padding: 13px 16px;
      background: #ffffff;
      color: #000000;
      font-weight: 800;
      transition: transform .15s, opacity .15s;
    }

    .primary:hover {
      transform: translateY(-1px);
    }

    .primary:disabled {
      opacity: .5;
      cursor: wait;
      transform: none;
    }

    .secondary {
      border: 1px solid #292929;
      border-radius: 11px;
      padding: 10px 13px;
      background: #111111;
      color: #ffffff;
      transition: background .15s;
    }

    .secondary:hover {
      background: #191919;
    }

    .button-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 9px;
    }

    .button-row.three {
      grid-template-columns: repeat(3, 1fr);
    }

    .chat {
      display: flex;
      flex-direction: column;
      min-height: 320px;
    }

    .chat-log {
      min-height: 100px;
      max-height: 300px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
    }

    .message {
      border-radius: 11px;
      padding: 10px 11px;
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .message.ai {
      background: #111111;
      border: 1px solid #202020;
      color: #cfcfcf;
    }

    .message.user {
      background: #ffffff;
      color: #000000;
      align-self: flex-end;
      max-width: 90%;
    }

    .chat-input {
      min-height: 100px;
      resize: vertical;
    }

    .preview-area {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: #111111;
    }

    .preview-toolbar {
      height: 54px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 12px;
      border-bottom: 1px solid #222222;
      background: #0b0b0b;
    }

    .view-buttons,
    .action-buttons {
      display: flex;
      gap: 7px;
      align-items: center;
      flex-wrap: wrap;
    }

    .toolbar-button {
      border: 1px solid #282828;
      background: #111111;
      color: #cccccc;
      padding: 8px 11px;
      border-radius: 9px;
      font-size: 12px;
    }

    .toolbar-button.active,
    .toolbar-button:hover {
      background: #222222;
      color: #ffffff;
    }

    .preview-frame {
      flex: 1;
      min-height: 0;
      position: relative;
      background: #ffffff;
    }

    iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #ffffff;
    }

    .code-panel {
      position: absolute;
      inset: 0;
      background: #050505;
      display: none;
      flex-direction: column;
    }

    .code-panel.show {
      display: flex;
    }

    .code-header {
      flex-shrink: 0;
      padding: 10px 14px;
      border-bottom: 1px solid #222222;
      color: #888888;
      font-size: 12px;
    }

    #codeOutput {
      flex: 1;
      width: 100%;
      resize: none;
      border: 0;
      border-radius: 0;
      background: #050505;
      color: #d8d8d8;
      font-family:
        "Cascadia Code",
        Consolas,
        monospace;
      font-size: 12px;
      line-height: 1.5;
    }

    .empty {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #777777;
      text-align: center;
      padding: 30px;
      pointer-events: none;
    }

    .empty strong {
      display: block;
      color: #ffffff;
      font-size: 20px;
      margin-bottom: 7px;
    }

    .error {
      color: #ff7676;
      font-size: 12px;
      margin-top: 10px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 900px) {
      .workspace {
        grid-template-columns: 1fr;
      }

      .sidebar {
        border-right: 0;
        border-bottom: 1px solid #202020;
        max-height: none;
      }

      .preview-area {
        height: 75vh;
        min-height: 550px;
      }
    }

    @media (max-width: 600px) {
      .topbar {
        padding: 0 12px;
      }

      .status {
        display: none;
      }

      .panel {
        padding: 14px;
      }

      .button-row.three {
        grid-template-columns: 1fr;
      }

      .preview-toolbar {
        height: auto;
        align-items: stretch;
        flex-direction: column;
      }

      .view-buttons,
      .action-buttons {
        width: 100%;
      }

      .toolbar-button {
        flex: 1;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="logo">S</div>
      <span>SPDP AI</span>
    </div>

    <div class="status">
      <span class="status-dot"></span>
      AI Builder Online
    </div>
  </header>

  <main class="workspace">

    <aside class="sidebar">

      <section class="panel">

        <div class="panel-title">
          Create Website
        </div>

        <textarea
          id="prompt"
          placeholder="Describe the website you want...

Example:
Create a premium black 3D gaming website for SPDP AI with a hero section, animated Three.js scene, features, pricing, testimonials, FAQ and footer."
        ></textarea>

        <button
          id="generateBtn"
          class="primary"
        >
          Generate Website
        </button>

        <div
          id="mainError"
          class="error hidden"
        ></div>

      </section>

      <section class="panel">

        <div class="panel-title">
          Website Controls
        </div>

        <div class="button-row">

          <button
            id="copyBtn"
            class="secondary"
          >
            Copy Code
          </button>

          <button
            id="downloadBtn"
            class="secondary"
          >
            Download
          </button>

        </div>

        <div class="button-row">

          <button
            id="undoBtn"
            class="secondary"
          >
            Undo
          </button>

          <button
            id="redoBtn"
            class="secondary"
          >
            Redo
          </button>

        </div>

      </section>

      <section class="panel chat">

        <div class="panel-title">
          Sub-chat Edit
        </div>

        <div
          id="chatLog"
          class="chat-log"
        >
          <div class="message ai">
            Generate a website first. Then tell me what you want to change.

Example:
"Make the hero section blue and add animated cards."
          </div>
        </div>

        <textarea
          id="chatInput"
          class="chat-input"
          placeholder="Tell SPDP AI what to change..."
        ></textarea>

        <button
          id="editBtn"
          class="primary"
        >
          Update Website
        </button>

        <div
          id="chatError"
          class="error hidden"
        ></div>

      </section>

    </aside>

    <section class="preview-area">

      <div class="preview-toolbar">

        <div class="view-buttons">

          <button
            id="previewBtn"
            class="toolbar-button active"
          >
            Preview
          </button>

          <button
            id="codeBtn"
            class="toolbar-button"
          >
            Code
          </button>

        </div>

        <div class="action-buttons">

          <button
            id="desktopBtn"
            class="toolbar-button active"
          >
            Desktop
          </button>

          <button
            id="tabletBtn"
            class="toolbar-button"
          >
            Tablet
          </button>

          <button
            id="mobileBtn"
            class="toolbar-button"
          >
            Mobile
          </button>

          <button
            id="openBtn"
            class="toolbar-button"
          >
            Open
          </button>

        </div>

      </div>

      <div
        id="previewFrame"
        class="preview-frame"
      >

        <iframe
          id="preview"
          title="Generated Website Preview"
          sandbox="allow-scripts allow-forms allow-modals allow-popups allow-same-origin"
        ></iframe>

        <div
          id="emptyState"
          class="empty"
        >
          <div>
            <strong>SPDP AI Website Builder</strong>
            Enter a prompt and generate your website.
          </div>
        </div>

        <div
          id="codePanel"
          class="code-panel"
        >
          <div class="code-header">
            Generated HTML
          </div>

          <textarea
            id="codeOutput"
            spellcheck="false"
            readonly
          ></textarea>
        </div>

      </div>

    </section>

  </main>

</div>

<script>
  const WORKER_URL =
    "https://spdp-ai.spdp3127.workers.dev/";

  const promptEl =
    document.getElementById("prompt");

  const generateBtn =
    document.getElementById("generateBtn");

  const editBtn =
    document.getElementById("editBtn");

  const chatInput =
    document.getElementById("chatInput");

  const chatLog =
    document.getElementById("chatLog");

  const preview =
    document.getElementById("preview");

  const codeOutput =
    document.getElementById("codeOutput");

  const emptyState =
    document.getElementById("emptyState");

  const codePanel =
    document.getElementById("codePanel");

  const previewBtn =
    document.getElementById("previewBtn");

  const codeBtn =
    document.getElementById("codeBtn");

  const mainError =
    document.getElementById("mainError");

  const chatError =
    document.getElementById("chatError");

  const desktopBtn =
    document.getElementById("desktopBtn");

  const tabletBtn =
    document.getElementById("tabletBtn");

  const mobileBtn =
    document.getElementById("mobileBtn");

  let currentHTML = "";
  let history = [];
  let historyIndex = -1;

  function showError(element, message) {
    element.textContent = message || "";
    element.classList.toggle(
      "hidden",
      !message
    );
  }

  function addChatMessage(
    text,
    type = "ai"
  ) {
    const message =
      document.createElement("div");

    message.className =
      "message " + type;

    message.textContent = text;

    chatLog.appendChild(message);

    chatLog.scrollTop =
      chatLog.scrollHeight;
  }

  function saveHistory() {
    if (!currentHTML) return;

    history =
      history.slice(
        0,
        historyIndex + 1
      );

    history.push(currentHTML);

    historyIndex =
      history.length - 1;
  }

  function renderHTML(html) {
    currentHTML = html;

    codeOutput.value = html;

    preview.srcdoc = html;

    emptyState.classList.add(
      "hidden"
    );
  }

  function setLoading(button, loadingText) {
    button.dataset.oldText =
      button.textContent;

    button.textContent =
      loadingText;

    button.disabled = true;
  }

  function stopLoading(button) {
    button.textContent =
      button.dataset.oldText ||
      "Generate";

    button.disabled = false;
  }

  async function callWorker(
    action,
    prompt,
    existingHTML = ""
  ) {
    const response = await fetch(
      WORKER_URL,
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({
          action,
          prompt,
          currentHTML:
            existingHTML
        })
      }
    );

    const raw =
      await response.text();

    let data;

    try {
      data = JSON.parse(raw);
    } catch {
      throw new Error(
        "Worker returned invalid JSON:\n" +
        raw.slice(0, 500)
      );
    }

    if (!response.ok || !data.success) {
      throw new Error(
        data.error ||
        "SPDP AI request failed."
      );
    }

    if (
      typeof data.html !==
      "string"
    ) {
      throw new Error(
        "Worker returned no HTML."
      );
    }

    return data.html;
  }

  generateBtn.addEventListener(
    "click",
    async () => {

      const prompt =
        promptEl.value.trim();

      showError(
        mainError,
        ""
      );

      if (!prompt) {
        showError(
          mainError,
          "Please enter a website prompt."
        );
        return;
      }

      setLoading(
        generateBtn,
        "Generating..."
      );

      try {

        const html =
          await callWorker(
            "create",
            prompt
          );

        currentHTML = html;

        history = [html];
        historyIndex = 0;

        renderHTML(html);

        addChatMessage(
          "Website generated successfully. Tell me what you want to change."
        );

      } catch (error) {

        showError(
          mainError,
          error?.message ||
          "Generation failed."
        );

      } finally {

        stopLoading(
          generateBtn
        );
      }
    }
  );

  editBtn.addEventListener(
    "click",
    async () => {

      const instruction =
        chatInput.value.trim();

      showError(
        chatError,
        ""
      );

      if (!currentHTML) {
        showError(
          chatError,
          "Generate a website first."
        );
        return;
      }

      if (!instruction) {
        showError(
          chatError,
          "Tell me what you want to change."
        );
        return;
      }

      addChatMessage(
        instruction,
        "user"
      );

      chatInput.value = "";

      setLoading(
        editBtn,
        "Updating..."
      );

      try {

        const oldHTML =
          currentHTML;

        const updatedHTML =
          await callWorker(
            "edit",
            instruction,
            oldHTML
          );

        currentHTML =
          updatedHTML;

        history =
          history.slice(
            0,
            historyIndex + 1
          );

        history.push(
          updatedHTML
        );

        historyIndex =
          history.length - 1;

        renderHTML(
          updatedHTML
        );

        addChatMessage(
          "Done. The website has been updated."
        );

      } catch (error) {

        showError(
          chatError,
          error?.message ||
          "Update failed."
        );

        addChatMessage(
          "I could not update the website: " +
          (error?.message || "Unknown error.")
        );

      } finally {

        stopLoading(
          editBtn
        );
      }
    }
  );

  chatInput.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter" &&
        (event.ctrlKey ||
          event.metaKey)
      ) {
        editBtn.click();
      }

    }
  );

  previewBtn.addEventListener(
    "click",
    () => {

      preview.style.display =
        "block";

      codePanel.classList.remove(
        "show"
      );

      previewBtn.classList.add(
        "active"
      );

      codeBtn.classList.remove(
        "active"
      );
    }
  );

  codeBtn.addEventListener(
    "click",
    () => {

      preview.style.display =
        "none";

      codePanel.classList.add(
        "show"
      );

      codeBtn.classList.add(
        "active"
      );

      previewBtn.classList.remove(
        "active"
      );

      codeOutput.value =
        currentHTML;
    }
  );

  document
    .getElementById("copyBtn")
    .addEventListener(
      "click",
      async () => {

        if (!currentHTML) return;

        try {

          await navigator.clipboard.writeText(
            currentHTML
          );

          addChatMessage(
            "HTML code copied to clipboard."
          );

        } catch {

          codeOutput.value =
            currentHTML;

          codeOutput.select();

          document.execCommand(
            "copy"
          );

        }
      }
    );

  document
    .getElementById("downloadBtn")
    .addEventListener(
      "click",
      () => {

        if (!currentHTML) return;

        const blob =
          new Blob(
            [currentHTML],
            {
              type:
                "text/html;charset=utf-8"
            }
          );

        const url =
          URL.createObjectURL(
            blob
          );

        const a =
          document.createElement(
            "a"
          );

        a.href = url;

        a.download =
          "spdp-ai-website.html";

        document.body.appendChild(a);

        a.click();

        a.remove();

        URL.revokeObjectURL(
          url
        );
      }
    );

  document
    .getElementById("openBtn")
    .addEventListener(
      "click",
      () => {

        if (!currentHTML) return;

        const blob =
          new Blob(
            [currentHTML],
            {
              type:
                "text/html"
            }
          );

        const url =
          URL.createObjectURL(
            blob
          );

        window.open(
          url,
          "_blank"
        );

        setTimeout(
          () =>
            URL.revokeObjectURL(
              url
            ),
          60000
        );
      }
    );

  function setPreviewWidth(
    width,
    activeButton
  ) {

    const frame =
      document.getElementById(
        "previewFrame"
      );

    frame.style.display =
      "flex";

    preview.style.position =
      "absolute";

    preview.style.left =
      "50%";

    preview.style.transform =
      "translateX(-50%)";

    preview.style.width =
      width;

    [
      desktopBtn,
      tabletBtn,
      mobileBtn
    ].forEach(button =>
      button.classList.remove(
        "active"
      )
    );

    activeButton.classList.add(
      "active"
    );
  }

  desktopBtn.addEventListener(
    "click",
    () => {

      preview.style.left =
        "0";

      preview.style.transform =
        "none";

      preview.style.width =
        "100%";

      desktopBtn.classList.add(
        "active"
      );

      tabletBtn.classList.remove(
        "active"
      );

      mobileBtn.classList.remove(
        "active"
      );
    }
  );

  tabletBtn.addEventListener(
    "click",
    () => {

      setPreviewWidth(
        "768px",
        tabletBtn
      );
    }
  );

  mobileBtn.addEventListener(
    "click",
    () => {

      setPreviewWidth(
        "390px",
        mobileBtn
      );
    }
  );

  document
    .getElementById("undoBtn")
    .addEventListener(
      "click",
      () => {

        if (
          historyIndex <= 0
        ) {
          return;
        }

        historyIndex--;

        renderHTML(
          history[
            historyIndex
          ]
        );

        addChatMessage(
          "Undo applied."
        );
      }
    );

  document
    .getElementById("redoBtn")
    .addEventListener(
      "click",
      () => {

        if (
          historyIndex >=
          history.length - 1
        ) {
          return;
        }

        historyIndex++;

        renderHTML(
          history[
            historyIndex
          ]
        );

        addChatMessage(
          "Redo applied."
        );
      }
    );

  promptEl.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter" &&
        (event.ctrlKey ||
          event.metaKey)
      ) {
        generateBtn.click();
      }

    }
  );
</script>

</body>
</html>
